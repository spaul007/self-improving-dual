# vLLM launch config for openai/gpt-oss-120b.
#
# 117B-param MoE with MXFP4 quantization on the MoE weights — fits on a
# single 80GB H100. Set `gres: gpu:h100:1` to reserve one card; the model
# loads in ~2-3 minutes from the HF cache once weights are downloaded.
#
# Note: gpt-oss needs a vLLM pre-release wheel. If you keep the server
# venv tracking the mainline vLLM for the Qwen models, run `launch.sh`
# against this config in a separate venv (override the `venv` field).

hf_repo: "openai/gpt-oss-120b"
# Name used for the per-model discovery file
# (`<server_root>/endpoint_<discovery_name>.json`). Defaults to the
# config basename if omitted, but pinning it here keeps the contract
# explicit when multiple servers run concurrently.
discovery_name: "gpt_oss_120b"
port: 8001
# TP=2 across two H100s. TP=1 OOMs during MXFP4 swizzle: the
# quantized weights alone occupy ~72 GB of the 80 GB H100, leaving
# under 1 GB free for the transient weight-conversion buffer that
# needs 1 GB. The 2026-05-12 retry with --gpu-memory-utilization 0.95
# + max_model_len 32768 still couldn't make it fit. Sharding the
# weights across 2 GPUs cuts the per-GPU model footprint roughly in
# half (~36 GB) and gives the kernel headroom for activations + KV.
tensor_parallel_size: 2
# 32k context is fine for travel-benchmark cases and keeps the KV
# cache reservation modest.
max_model_len: 32768
gres: "gpu:h100:2"
slurm_time: "24:00:00"
# Use mainline vLLM. The original gpt-oss launch instructions pointed
# at a pre-release wheel `vllm==0.10.1+gptoss` from
# https://wheels.vllm.ai/gpt-oss/ that pinned a one-off torch nightly
# (`torch==2.9.0.dev20250804+cu128`) which is no longer on PyPI —
# `pip install` failed during the 2026-05-12 bake-off with
# `No matching distribution found for torch==2.9.0...`. gpt-oss
# support has since been merged into mainline vLLM, so the stable
# release is the right target.
pip_install_args:
  - "vllm"
# Use the same venv as the Qwen models — mainline vLLM is the same
# package for both. Saves disk and a redundant install.
venv: "/groups/AIC-MV/n.tzou/vllm_venv"
# gpt-oss uses OpenAI's Harmony response format. mainline vLLM has a
# Harmony-aware parser registered as `openai` (see
# vllm/tool_parsers/openai_tool_parser.py — uses harmony_utils.
# parse_output_into_messages and operates on token IDs, so it must
# be enabled at startup; auto-detection from the model id is not
# enough). Without these flags the server returns
# `tool_calls: []` even when the reasoning trace clearly shows the
# model trying to call a function (verified live on 2026-05-12).
#
# `--gpu-memory-utilization 0.85` (default 0.9). At TP=2 the weight
# load fits, but `--gpu-memory-utilization 0.95` was too tight: the
# KV-cache profile pass (which transiently allocates ~2 GB to size
# the cache) OOMed with only 202 MiB free. 0.85 leaves ~12 GB of
# slack per GPU outside vLLM's budget, which is enough for those
# transient allocations. KV-cache size at max_model_len=32768 is
# still ample for the 8-way parallelism the eval uses.
extra_vllm_args:
  - "--gpu-memory-utilization"
  - "0.85"
  - "--enable-auto-tool-choice"
  - "--tool-call-parser"
  - "openai"
