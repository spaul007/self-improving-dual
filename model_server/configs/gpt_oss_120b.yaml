# vLLM launch config for openai/gpt-oss-120b.
#
# 117B-param MoE with MXFP4 quantization on the MoE weights — fits on a
# single 80GB H100. Set `gres: gpu:h100:1` to reserve one card; the model
# loads in ~2-3 minutes from the HF cache once weights are downloaded.
#
# Note: gpt-oss needs a vLLM pre-release wheel. If you keep the server
# venv tracking the mainline vLLM for the Qwen models, run `launch.sh`
# against this config in a separate venv (override the `venv` field).

hf_repo: "openai/gpt-oss-120b"
# Name used for the per-model discovery file
# (`<server_root>/endpoint_<discovery_name>.json`). Defaults to the
# config basename if omitted, but pinning it here keeps the contract
# explicit when multiple servers run concurrently.
discovery_name: "gpt_oss_120b"
port: 8001
tensor_parallel_size: 1
max_model_len: 131072
gres: "gpu:h100:1"
slurm_time: "24:00:00"
# Use mainline vLLM. The original gpt-oss launch instructions pointed
# at a pre-release wheel `vllm==0.10.1+gptoss` from
# https://wheels.vllm.ai/gpt-oss/ that pinned a one-off torch nightly
# (`torch==2.9.0.dev20250804+cu128`) which is no longer on PyPI —
# `pip install` failed during the 2026-05-12 bake-off with
# `No matching distribution found for torch==2.9.0...`. gpt-oss
# support has since been merged into mainline vLLM, so the stable
# release is the right target.
pip_install_args:
  - "vllm"
# Use the same venv as the Qwen models — mainline vLLM is the same
# package for both. Saves disk and a redundant install.
venv: "/groups/AIC-MV/n.tzou/vllm_venv"
# gpt-oss uses OpenAI's Harmony response format; mainline vLLM has
# a built-in parser for it triggered automatically by model id, so
# we don't pass `--enable-auto-tool-choice` or a parser name here.
# If tool calls aren't parsed correctly when this runs, the live
# trace will show it (look for num_tool_calls in trace.jsonl).
extra_vllm_args: []
