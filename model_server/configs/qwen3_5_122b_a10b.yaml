# vLLM launch config for Qwen/Qwen3.5-122B-A10B.
#
# MoE: 122B total, 10B active per token. Recommended layout per the
# model card: `--tensor-parallel-size 8` on a single 8x H100 node.
# Weights ~245GB bf16, fits comfortably in 640GB HBM with TP=8.

hf_repo: "Qwen/Qwen3.5-122B-A10B"
discovery_name: "qwen3_5_122b_a10b"
port: 8000
tensor_parallel_size: 8
max_model_len: 262144
gres: "gpu:h100:8"
slurm_time: "24:00:00"
pip_install_args:
  - "vllm"
venv: "/groups/AIC-MV/n.tzou/vllm_venv"
# Qwen3.5 emits tool calls in its Hermes-style XML format
# (`<tool_call><function=NAME><parameter=KEY>VALUE</parameter>...`).
# Without `--enable-auto-tool-choice --tool-call-parser hermes`, vLLM
# returns those tokens as plain `output_text` and the wrapper sees
# `num_tool_calls: 0` — exactly the bake-off failure on 2026-05-12.
# `--reasoning-parser qwen3` is unrelated: it strips the "thinking"
# tokens from the visible content. Both flags are needed.
extra_vllm_args:
  - "--reasoning-parser"
  - "qwen3"
  - "--enable-auto-tool-choice"
  - "--tool-call-parser"
  - "hermes"
