# vLLM launch config for Qwen/Qwen3.5-122B-A10B.
#
# MoE: 122B total, 10B active per token. Recommended layout per the
# model card: `--tensor-parallel-size 8` on a single 8x H100 node.
# Weights ~245GB bf16, fits comfortably in 640GB HBM with TP=8.

hf_repo: "Qwen/Qwen3.5-122B-A10B"
discovery_name: "qwen3_5_122b_a10b"
port: 8000
tensor_parallel_size: 8
max_model_len: 262144
gres: "gpu:h100:8"
slurm_time: "24:00:00"
pip_install_args:
  - "vllm"
venv: "/groups/AIC-MV/n.tzou/vllm_venv"
# Qwen3.5 emits tool calls in an XML-tag format that's distinct
# from Hermes' JSON-in-tags form:
#   <tool_call><function=NAME><parameter=KEY>VALUE</parameter></function></tool_call>
# vLLM ships a dedicated parser for this — `qwen3_xml`. A first
# attempt with `--tool-call-parser hermes` left `tool_calls: []`
# on the response and the call text in `content` (verified live on
# 2026-05-12). With `qwen3_xml` the parser actually fires.
# `--reasoning-parser qwen3` is unrelated: it strips the "thinking"
# tokens from the visible content. Both flags are needed.
extra_vllm_args:
  - "--reasoning-parser"
  - "qwen3"
  - "--enable-auto-tool-choice"
  - "--tool-call-parser"
  - "qwen3_xml"
