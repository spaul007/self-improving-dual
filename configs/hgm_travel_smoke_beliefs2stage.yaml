experiment_name: "travel_hgm_smoke60_beliefs2stage"

# End-to-end smoke for the belief-registry + two-stage-editor stack on the
# REAL 60-case train split, small budget (96 evals ≈ 6 batches, ≤8 rounds),
# task agent at medium effort, full seed pre-eval on all 60 cases (free, not
# charged to the budget). Checks the artifacts, not the score:
#   * every expanded round_*/ has edit_code.md (+ edit_prediction.json and
#     retrieval_manifest.json when stage 1 succeeded)
#   * run root grows edit_memory_beliefs.md + edit_memory_beliefs_state.json
#     (n_updates advancing with eval batches) + edit_memory_beliefs_archive/
#   * with META_AGENT_VERBOSE=1, editor_attempt_1_user.txt shows the belief
#     block and does NOT contain "Every edit, oldest first".
# Point base_url at a live vLLM endpoint before running:
#   python3 main_loop.py --config configs/hgm_travel_smoke_beliefs2stage.yaml
project: "travel"

eval_visibility: "blackbox"

loop:
  max_rounds: 8
  score_target: 0.99

task_agent:
  model: "Qwen/Qwen3.5-122B-A10B"
  reasoning_effort: "medium"
  base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

manager:
  type: "hgm"
  config:
    eval_budget: 96
    init_expansions: 2
    alpha: 0.5
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 16
    finalize_top_k: 2
    snapshot_tree: false
    seed: 42

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 1800
    memory_mb: 2048
    parallelism: 16
    scorer: "travel_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"

editor:
  type: "two_stage"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "low"
    max_attempts: 2
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
    propose_reasoning_effort: "low"
    retrieval_char_budget: 30000
    max_retrieved_nodes: 4

edit_memory:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "low"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
    steering: true
    steering_token_budget: 48000
    verdict_threshold: 0.02
    min_shared: 8
    max_strategies: 18
    max_subedits: 3
    diff_char_cap: 6000
    setup_pass: true
    per_check_recipe: null
    code_record: true
    code_diff_char_cap: 20000
    steering_mode: "belief"
    beliefs:
      enabled: true
      reflect_every: 3     # smoke: make the reflection path fire early
      doc_char_cap: 48000

env:
  META_AGENT_STRIP_REASONING: "1"
  META_AGENT_VERBOSE: "1"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-122B-A10B"
  TRAVEL_CONVERT_BASE_URL: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

split:
  train_ids_path: "configs/travel_train_ids.json"   # the full 60-case set

validators:
  - type: "syntax"
  - type: "signature"
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
