# Evaluation config for the Qwen3.8-27B task agent, THINKING OFF, routed at the
# load-distributing endpoint gpu-aic-mv-02-st-p5-node-3:8010 (fronts two 27B
# vLLM servers). Used by snapshot_eval.py to re-evaluate the LCB-selected node
# of the four 3000-eval runs on the full 120-case benchmark, so every run is
# measured through the same endpoint and the same task-agent settings:
#
#   PYTHONPATH=. python3 snapshot_eval.py --config configs/eval_travel_qwen38_27b_lb_nothink.yaml \
#       --experiment-dir runs/<run> --at-budget 3000 --select lcb --parallelism 16 --repeats 2
#
# Thinking off: reasoning_effort does NOT control it on these servers (a request
# with no `reasoning` field still returns reasoning tokens). The chat-template
# flag below is the only switch; it reaches each case subprocess as
# LLM_EXTRA_BODY and is merged verbatim into the request body.

experiment_name: "eval_travel_qwen38_27b_lb_nothink"
project: "travel"

loop:
  max_rounds: 1
  score_target: 1.0

task_agent:
  model: "Qwen/Qwen3.8-27B"
  temperature: 0.2
  max_output_tokens: 16384          # guard against a degenerate loop
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
  base_url: "http://gpu-aic-mv-02-st-p5-node-3:8010/v1"

# (manager/editor are required by the schema but unused by snapshot_eval.py /
# evaluate.py; the editor names an endpoint only to silence the assembly warning.)
manager:
  type: "hgm"
  config:
    eval_budget: 3000
    init_expansions: 3
    alpha: 0.5
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 16
    finalize_top_k: 3
    snapshot_tree: true
    seed: 42

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 1800
    memory_mb: 2048
    parallelism: 16
    scorer: "travel_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"

editor:
  type: "agentic"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
    max_attempts: 3

env:
  META_AGENT_STRIP_REASONING: "1"
  LLM_TIMEOUT_S: "1200"
  # Plan->JSON conversion on the 122B server, exactly as in the optimization
  # runs, so scores stay comparable. The scorer builds its own client, so the
  # task agent's thinking-off flag does not apply to it.
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-122B-A10B"
  TRAVEL_CONVERT_BASE_URL: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
  # Each case runs under RLIMIT_AS = memory_mb (2 GB); OpenBLAS's per-core
  # thread buffers alone exceed that on a many-core node.
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

split:
  train_ids_path: "configs/travel_train_ids.json"

validators:
  - type: "syntax"
  - type: "signature"
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
