# hgm_dual optimization run for the SINGLE-AGENT travel task
# (projects/travel/seed -- the original brittle one-agent tool-loop, NOT
# travel_mas), task agent on the local vLLM server hosting
# Qwen/Qwen3.5-35B-A3B (node-1), implicit mode (no reasoning_effort;
# temperature=0.2 + max_output_tokens=16384 -- this session's established
# tuning for this model/node, see configs/eval_local_travel_qwen35b_implicit.yaml's
# task_agent comment for the full rationale: reasoning_effort="medium" causes
# a catastrophic tool-calling breakdown on this endpoint, documented in
# qwen35bnotworking.md; implicit mode is the only setting that keeps the
# single agent functional at all -- though even then its unedited-seed
# full-120 score was 0.0 (100% no_plan_rate), so this run is a genuine test
# of whether HGM's prompt/code editing can recover a working agent, not a
# refinement of an already-working one.
#
# Modeled directly on configs/hgm_dual_travel_1000_qwen122b_node2.yaml (the
# existing single-agent hgm_dual reference config), with:
#   - task_agent switched from 122B/node-2 (reasoning_effort: high) to
#     35B/node-1 implicit (temperature/max_output_tokens instead)
#   - manager.config.eval_budget corrected to the requested 1000 (the
#     reference file's own eval_budget was left at a stale value of 50
#     despite its filename/experiment_name saying "1000" -- not copied here)
#   - evaluator.parallelism dropped from 16 -> 3: the 35B/node-1 server is
#     known to saturate fast at higher concurrency (parallelism 8 produced
#     ~140 APIConnectionError retries and 0 passes in earlier testing),
#     unlike the 122B/8xH100 server the reference config targets
#   - editor/summarizer left UNCHANGED on Qwen/Qwen3.5-122B-A10B @ node-2,
#     reasoning_effort: medium -- the editor does self-improvement code
#     editing, a different workload from the task agent's fragile tool-
#     calling loop, and doesn't need to run on the endpoint being evaluated.
#     Matches the exact editor/summarizer convention already used for
#     math_mas/db_mas/travel_mas's hgm_dual configs this session.
#
#   PYTHONPATH=. python3 main_loop.py --config configs/hgm_dual_travel_single_35b_1000.yaml

experiment_name: "travel_hgm_dual_single_35b_1000"
project: "travel"

eval_visibility: "blackbox"

loop:
  max_rounds: 1000
  score_target: 0.99

task_agent:
  model: "Qwen/Qwen3.5-35B-A3B"
  # reasoning_effort intentionally omitted -- implicit mode (see header).
  temperature: 0.2
  max_output_tokens: 16384
  base_url: "http://gpu-aic-mv-02-st-p5-node-1:8000/v1"

manager:
  type: "hgm_dual"
  config:
    eval_budget: 1000
    init_expansions: 3
    alpha: 0.5
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 16
    finalize_top_k: 3
    seed: 42
    num_variants: 2
    intra_expand_eval_size: 16
    variant_parallelism: 2
    select_metric: "mean"
    categorizer_max_representative_errors: 5
    min_remaining_budget_for_dual: 16
    category_selection: "balanced_by_type"
    category_types: ["commonsense", "hard_constraint"]
    snapshot_tree: true
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 1800
    memory_mb: 2048
    # Conservative for the 35B/node-1 server -- see header comment.
    parallelism: 3
    scorer: "travel_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"

editor:
  # Deliberately NOT the same model/endpoint as task_agent -- matches
  # math_mas/db_mas/travel_mas's hgm_dual editor convention exactly.
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-2:8000/v1"
    max_attempts: 2

summarizer:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-2:8000/v1"

# Local models (Qwen3.x, gpt-oss) misread echoed `reasoning` items in the
# conversation history as a "wrap up" signal and exit the tool loop without
# writing the formal <plan> block -- strip them before the next call.
# TRAVEL_CONVERT_MODEL routes the scorer's plan->JSON conversion at the same
# Qwen model as the task agent (its base_url comes from task_agent.base_url
# -> LLM_BASE_URL, which meta_agent/runtime_env.py exports into the
# evaluator subprocess environment).
env:
  META_AGENT_STRIP_REASONING: "1"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-35B-A3B"

split:
  train_ids_path: "configs/travel_train_ids.json"   # 60 predetermined cases; no held-out eval

validators:
  - type: "syntax"
  - type: "signature"
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
