# EVAL-ONLY config: task agent on OpenRouter deepseek/deepseek-v4-pro at
# reasoning_effort MEDIUM. Replaces the abandoned deepseek-v4-flash-latest
# eval (budget_99999998, stopped 2026-08-28 at ~run_1 60%: ~60% of cases
# exited the tool loop without emitting <plan> tags -> score 0). Scorer
# conversion stays on the LOCAL vLLM node-5 Qwen/Qwen3.5-122B-A10B —
# identical to eval_local_qwen122b_medium.yaml / eval_or_glm53flash_medium
# — so scoring is comparable across the model-transfer evals.
#
# For snapshot_eval.py over the 20260827 OpenRouter A/B pair
# (…_or_medium_no_editmem / …_or_medium_editmem): cross-model transfer of
# each arm's best agent (prompt-only node 31 vs verify-loop node 27).
#
# Slug/tools/reasoning_effort/temperature verified live through
# platform_core.llm_wrapper on 2026-08-28 (tool_calls returned,
# temperature 0.2 accepted alongside reasoning, no 400).
#
# NOTE: unlike the earlier Qwen/GLM/flash evals (provider-default
# sampling), runs from this config pin the task agent at temperature 0.2
# via the new task_agent.temperature default (child-only LLM_TEMPERATURE).
#
# COLLISION NOTE: budget numbers in use in these experiment dirs:
#   budget_99999999 = Qwen local medium      (lcb_full_benchmark/...)
#   budget_99999998 = DeepSeek V4 Flash      (lcb_custom/..., ABANDONED)
#   budget_99999997 = GLM-5.3-Flash          (lcb_custom/...)
#   budget_99999996 = 3-case smoke test      (lcb_custom/..., ignore)
#   budget_99999995 = THIS config (DeepSeek V4 Pro), with
#                     --case-ids 0..119 (full benchmark; "custom" label)
#
# AUTH: platform_core/llm_wrapper.py reads ONE global OPENAI_API_KEY for every
# LLM site. Export the OpenRouter key as OPENAI_API_KEY before launching
# (AFTER sourcing api.sh, which sets OPENAI_API_KEY to the real OpenAI key).
experiment_name: "travel_eval_dsv4pro_medium"

project: "travel"

eval_visibility: "blackbox"

loop:
  max_rounds: 1000
  score_target: 0.99

task_agent:
  model: "deepseek/deepseek-v4-pro"
  reasoning_effort: "medium"
  base_url: "https://openrouter.ai/api/v1"
  # temperature: 0.2 is the TaskAgentSpec default (pinned low-variance
  # sampling); set `temperature: null` here for provider-default sampling.

manager:
  type: "hgm"
  config:
    eval_budget: 1000
    init_expansions: 3
    alpha: 0.5
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 16
    finalize_top_k: 3
    snapshot_tree: true
    seed: 42

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 1800
    memory_mb: 2048
    parallelism: 16
    scorer: "travel_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"

# editor unused by snapshot_eval; kept for config-schema completeness.
editor:
  type: "default"
  config:
    model: "deepseek/deepseek-v4-pro"
    reasoning_effort: "medium"
    max_attempts: 2
    base_url: "https://openrouter.ai/api/v1"

env:
  META_AGENT_STRIP_REASONING: "1"
  # Conversion is part of evaluation; keep it on the local Qwen node so the
  # scoring pipeline matches the other model-transfer evals exactly.
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-122B-A10B"
  TRAVEL_CONVERT_BASE_URL: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

split:
  train_ids_path: "configs/travel_train_ids.json"   # 60 predetermined cases

validators:
  - type: "syntax"
  - type: "signature"
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
