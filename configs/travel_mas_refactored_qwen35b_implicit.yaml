# Multi-agent travel planner (Flight -> Train -> Sightseeing -> Accounting),
# REFACTORED file layout: projects/travel_mas_refactored/seed/ splits each
# role into its own module under agents/ (agents/flight.py, agents/train.py,
# agents/sightseeing.py, agents/accounting.py, agents/common.py for shared
# plumbing), orchestrated by seed/mas_workflow.py, with seed/workflow.py
# reduced to a one-line frozen delegator -- mirrors math_mas's
# agents/<role>/ + mas_workflow.py + workflow.py split (see
# projects/math_mas/math_mas/), adapted to travel_mas's own synchronous
# tool-loop style rather than math_mas's async/BaseAgent/YAML-prompt design.
#
# This is a NEW sibling project (projects/travel_mas_refactored/), NOT a
# modification of projects/travel_mas/ -- the original is untouched and
# still usable via its own configs.
#
# Because the workflow logic now spans multiple files, this switches from
# travel_mas's legacy include-list mutable-surface convention (only
# workflow.py/tool_wrapper.py/tools_schema.json/mutable_tools/*.py editable)
# to an EXCLUDE-list (mutable_exclude, matching math_mas/db_mas's own
# convention -- see integrating.md Step 5): everything under seed/ is
# editable EXCEPT workflow.py (frozen glue), benchmark/ (already
# structurally unreachable, listed anyway for defense-in-depth per
# integrating.md), and agents/immutable/ (the fixed AgentMessage
# inter-agent collaboration contract -- see agents/immutable/message.py's
# own docstring; every stage function returns exactly one AgentMessage and
# takes an inbox: list[AgentMessage] of upstream agents' outputs, and this
# directory is excluded so HGM's editor can tune *how* each stage uses
# that contract but never redefine the contract itself).
# tool_wrapper.py/tools_schema.json/mutable_tools/*.py
# stay editable, same as they were under the old legacy scheme -- this
# project still uses the real ToolWrapper/tools_schema.json function-
# calling machinery (unlike math_mas/db_mas, which have their own separate
# tool systems), so the schema_wrapper_consistency/mutable_tool_imports/
# mutable_tool_routing/imports validators stay ON (integrating.md Step 5's
# advice to omit them only applies to projects that drop that convention
# entirely).
#
# Self-contained tools/data: projects/travel_mas_refactored/tools/ holds
# its own real copy of the 9 tool implementations (not a passthrough to
# projects.travel.tools), and projects/travel_mas_refactored/data/database_en
# is a symlink to projects/travel/data/database_en (same underlying
# per-sample CSVs, avoids duplicating ~431MB) -- so no TRAVEL_DATABASE_ROOT
# override is needed below; _csv.py's own project-relative default now
# resolves correctly for this project on its own.
#
#   PYTHONPATH=. python3 evaluate_task_agent.py \
#       --config configs/travel_mas_refactored_qwen35b_implicit.yaml \
#       --agent-dir projects/travel_mas_refactored/seed \
#       --limit 10 --parallelism 3

experiment_name: "travel_mas_refactored_qwen3_5_35b_node6_implicit"
project: "travel_mas_refactored"

mutable_exclude:
  - "workflow.py"
  - "benchmark/"
  - "agents/immutable/"

loop:
  max_rounds: 1
  score_target: 1.0

task_agent:
  model: "Qwen/Qwen3.5-35B-A3B"
  # reasoning_effort intentionally omitted -- implicit mode: thinking stays
  # on (Qwen3.5's chat-template default), the model decides for itself how
  # much to think, no imposed budget/target via an explicit effort level.
  # See configs/travel_mas_qwen35b_implicit.yaml for the full rationale
  # (reasoning_effort="medium" caused a catastrophic tool-calling breakdown
  # on this model, documented in qwen35bnotworking.md).
  temperature: 0.2
  max_output_tokens: 16384
  base_url: "http://gpu-aic-mv-02-st-p5-node-6:8000/v1"

manager:
  type: "hill_climbing"
  config:
    branch_policy: "best"
    strategy_history_window: 5

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 3600
    memory_mb: 2048
    # Conservative for the 35B/node-6 server (same ceiling used throughout
    # this session's other travel_mas/35B configs).
    parallelism: 3
    scorer: "travel_mas_refactored_default"

gatherer:
  type: "default"
  config:
    # Groups per-case failures by category (e.g. reasonable_transfer_time,
    # traceable_accommodation) with representative examples, instead of
    # degrading to 3 arbitrary hardest-cases -- reused verbatim from
    # projects/travel (pure schema-logic over dimension_details/
    # hard_constraints/failed_checks, which travel_mas_refactored's own
    # scorer emits identically; confirmed live 2026-09-01).
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"
    # Supplementary "hardest cases not already covered by a category"
    # top-off shown alongside the categorized examples above -- default
    # is 3; trimmed to 1 (2026-09-01) so the editor sees one extra worst
    # case rather than padding out the context with near-duplicates of
    # what the categorizer already surfaced.
    n_hard_cases: 1

editor:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
    max_attempts: 2

env:
  META_AGENT_STRIP_REASONING: "1"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-35B-A3B"

split:
  seed: 42
  train_size: 60

validators:
  - type: "syntax"
  # workflow.py is a trivial, permanently-excluded delegator to
  # mas_workflow.py's real run_task -- check both so a broken
  # mas_workflow.py::run_task signature is caught pre-evaluation (as a
  # retryable validator error) instead of crashing every eval case
  # identically at real-evaluation time. See editor_validators.py's
  # SignatureValidator docstring.
  - type: "signature"
    config:
      workflow_filenames: ["workflow.py", "mas_workflow.py"]
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
