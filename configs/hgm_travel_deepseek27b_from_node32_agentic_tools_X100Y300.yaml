# Sibling of configs/hgm_travel_deepseek27b_from_node32_agentic_X100Y300.yaml
# (the production run started 2026-09-29, currently at round_032+) with the
# same manager/editor/evaluator settings EXCEPT:
#
#   - seed_dir_name: "seed_from_node32" -> "seed" (default) -- starts from
#     the ORIGINAL seed MAS, not that run's already-evolved lineage, so
#     this is a genuine from-scratch comparison, not a continuation of it.
#   - editor.config.agentic_max_turns: 20 -> 100
#   - block_suggester.config.agentic_max_turns: 20 -> 100
#
# Both components' agentic tool sets were also just expanded in code (not a
# config change, so nothing below reflects it -- this run exercises it by
# construction):
#   - AgentEditor (agentic_editing) gained grep, str_replace_file, run_python
#     (sandboxed offline execution against this node's own evaluated cases),
#     list_cases, show_case -- on top of its existing read_file/write_file/
#     run_code_validators/submit_self_improvement_summary.
#   - BlockSuggester (agentic_access) gained list_cases, show_case -- on top
#     of its existing read_file/grep.
# Both components' agentic loops also now log a full per-turn/per-call
# transcript (args + output, not just the raw response) under round_dir/
# verbose/ when META_AGENT_VERBOSE=1 is set.
#
# Purpose: see whether a much larger per-EXPAND turn budget (100 vs. 20) plus
# the wider toolset (read-only case inspection, targeted string-replace
# edits, offline logic testing) meaningfully changes edit quality/compliance
# -- starting from the same original seed MAS the other run's own lineage
# ultimately started from, not a continuation of its already-evolved state.
#
# Same operational caveats as the sibling config: confirm OpenRouter balance
# is healthy, and note this run shares the task_agent/TRAVEL_CONVERT vLLM
# endpoint (gpu-aic-mv-02-st-p5-node-6) with the already-running sibling --
# running both concurrently means they compete for that same GPU capacity.
#
#   PYTHONPATH=. python3 main_loop.py --config configs/hgm_travel_deepseek27b_from_node32_agentic_tools_X100Y300.yaml

experiment_name: "travel_mas_refactored_deepseek27b_from_node32_agentic_tools_X100Y300"
project: "travel_mas_refactored"

mutable_exclude:
  - "workflow.py"
  - "benchmark/"
  - "agents/immutable/"

loop:
  max_rounds: 130
  score_target: 1.0

task_agent:
  model: "Qwen/Qwen3.8-27B"
  temperature: 0.2
  max_output_tokens: 16384
  base_url: "http://gpu-aic-mv-02-st-p5-node-6:8001/v1"

manager:
  type: "hgm_block_tagged"
  config:
    eval_budget: 30000
    init_expansions: 2
    alpha: 0.446716
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 60
    eval_repeats: 2  # >1 = repeats enabled (on/off switch, not a cap)
    finalize_top_k: 5
    full_eval_top_k: 0
    seed: 42
    block_selection_strategy: "adaptive"
    active_blocks:
      - "collaboration_workflow"
      - "foundation_capability"
      - "individual_subagent"
      - "mixed"
      - "verifiers"
    implementation_strategy_selection_strategy: "adaptive"
    # curriculum_enabled intentionally omitted (defaults to False) -- curriculum stays off.

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 3600
    memory_mb: 2048
    parallelism: 32
    scorer: "travel_mas_refactored_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"
    n_hard_cases: 1

editor:
  type: "default"
  config:
    model: "deepseek/deepseek-v4-pro"
    base_url: "https://openrouter.ai/api/v1"
    reasoning_effort: "medium"
    max_output_tokens: 65536
    max_attempts: 2
    agentic_editing: true
    agentic_max_turns: 100
    # evaluate_variant (new agentic tool): runs the editor's current
    # workspace through the REAL evaluator (full TRAIN set by default, or
    # a cheaper case_ids subset) mid-EXPAND, before committing to a
    # submit_self_improvement_summary. evaluator/benchmark_dir/
    # train_case_ids are auto-injected by config.py whenever AgentEditor
    # declares those params (true as of this run) -- no YAML needed for
    # that part. This is the one actually-configurable knob: a hard cap
    # on real evaluator.run calls per EXPAND, independent of
    # agentic_max_turns, since each call is genuine wall-clock + API cost
    # (a real subprocess run of every requested case through the task
    # agent). 3 is the default; set explicitly here for visibility.
    evaluate_variant_max_calls: 3
    # Explicit -- agentic_tools now defaults to the ORIGINAL pre-expansion
    # set (read_file/write_file/run_code_validators/submit_self_improvement_
    # summary only) unless listed here. This run was launched specifically
    # to exercise the expanded toolset, so pin it explicitly rather than
    # silently losing it on a future restart under this same config.
    agentic_tools:
      - "read_file"
      - "write_file"
      - "str_replace_file"
      - "grep"
      - "run_code_validators"
      - "run_python"
      - "list_cases"
      - "show_case"
      - "submit_self_improvement_summary"
      - "evaluate_variant"

failure_summarizer:
  type: "default"
  config:
    model: "deepseek/deepseek-v4-pro"
    base_url: "https://openrouter.ai/api/v1"
    reasoning_effort: "medium"

block_suggester:
  type: "default"
  config:
    model: "deepseek/deepseek-v4-pro"
    base_url: "https://openrouter.ai/api/v1"
    reasoning_effort: "medium"
    strategies_path: "strategies.md"
    agentic_access: true
    agentic_max_turns: 100
    # Explicit -- see the editor's own agentic_tools comment above for why.
    agentic_tools:
      - "read_file"
      - "grep"
      - "list_cases"
      - "show_case"
      - "run_python"

env:
  META_AGENT_STRIP_REASONING: "1"
  # Task agent's OWN calls (Qwen/Qwen3.8-27B, a thinking-hybrid model) --
  # LLM_ENABLE_THINKING is the generic platform_core/llm_wrapper.py env var
  # for this (distinct from TRAVEL_CONVERT_ENABLE_THINKING below, which only
  # covers the scorer's separate plan->JSON conversion call). Forced off so
  # neither of this run's two Qwen3.8-27B call sites reasons by default.
  LLM_ENABLE_THINKING: "false"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.8-27B"
  TRAVEL_CONVERT_BASE_URL: "http://gpu-aic-mv-02-st-p5-node-6:8001/v1"
  TRAVEL_CONVERT_ENABLE_THINKING: "false"

split:
  seed: 42
  train_size: 60
  eval_size: 60
  stratify_by: "meta_info.days"

validators:
  - type: "syntax"
  - type: "signature"
    config:
      workflow_filenames: ["workflow.py", "mas_workflow.py"]
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
  - type: "undefined_names"
  - type: "smoke_test"
