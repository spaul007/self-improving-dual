# An HGM run against math_mas sized by target tree shape, not directly by
# wall-clock time: "I want roughly X good-enough agents, each evaluated on
# roughly Y examples on average" -- X=20, Y=100 here.
#
#   PYTHONPATH=. python3 main_loop.py --config configs/hgm_math_mas_x20_y100.yaml
#
# --- How eval_budget and alpha were derived ---
#
# B = X*Y = 20*100 = 2000 (total budget).
# alpha solved from B**alpha == X (matches hgm_tree.py::schedule_favors_expand
# exactly -- "budget_spent**alpha >= n_real_nodes - 1" -- so at
# budget_spent==B, the schedule has allowed ~X nodes to exist, each having
# received ~Y evals on average by construction):
#   alpha = ln(X)/ln(B) = ln(20)/ln(2000) = 0.3941
# Sanity-checked (see the X/Y mode in size_eval_budget.py) that the schedule's
# growth curve is well-behaved with this alpha: ~9 nodes by 10% of budget
# spent (cheap, ~22 evals each), converging to ~21 nodes by 100% of budget
# (~95 evals each) -- close to the X=20/Y=100 targets, front-loaded
# exploration then concentrated refinement, not a hard cutoff.
#
#   python3 size_eval_budget.py --t-case 2.528 --target-agents 20 \
#     --evals-per-agent 100 --eval-batch-size 50 --fixed-unbudgeted-evals 600 \
#     --max-rounds 40
#   -> eval_budget=2000, alpha=0.3941, projected ~2.3h total (t_case=2.528s/
#   case at parallelism=16, measured from this project's own 500-case
#   baseline run -- see configs/hgm_math_mas_full.yaml for the full
#   throughput-measurement writeup this reuses unchanged).
#
# train_size set to Y=100 (not just "at least Y") so no single node can
# exceed the per-agent evaluation budget this run was framed around -- the
# schedule's own average-at-completion (~95) already lands just under that
# cap anyway. max_rounds set to 40 (~2x the X=20 target) as a generous but
# no-longer-100-sized upper bound, now that the schedule itself is what's
# expected to naturally stop around ~21 nodes.

experiment_name: "math_mas_hgm_x20_y100"

project: "math_mas"
seed_dir_name: "math_mas"

# Same exclude-list as the other math_mas configs -- see
# configs/hgm_math_mas_sanity.yaml for the full rationale on each entry.
mutable_exclude:
  - "tools/immutable/"
  - "eval/"
  - "workflow.py"
  - "benchmark/"

tool_source_dirs:
  - "tools"
  - "agents"

loop:
  # ~2x the X=20 target node count -- generous without being the
  # 100-node-sized cap the larger hgm_math_mas_full.yaml run used, since
  # eval_budget/alpha are now what's actually expected to bound growth.
  max_rounds: 40
  score_target: 1.0

manager:
  type: "hgm"
  config:
    eval_budget: 2000
    init_expansions: 1
    # Derived, not the framework default (0.6) -- see the sizing note above.
    alpha: 0.3941
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    # Half of train_size (100), matching the established convention: keeps
    # the number of summarizer-triggering EVALUATE steps
    # (eval_budget / eval_batch_size = 40) from dominating the run.
    eval_batch_size: 50
    # Top-3 candidates topped up to full train coverage before final
    # selection, and audited on the held-out eval set -- lets you notice
    # (and manually prefer, via evaluate_task_agent.py) a runner-up that
    # generalizes better than the train-only LCB pick, even though the
    # framework's own best_round is always the train-based selection
    # regardless of what this audit shows (confirmed directly in
    # hgm.py::_finalize).
    finalize_top_k: 3
    full_eval_top_k: 3
    seed: 42

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 600
    memory_mb: 1024
    # Matches the concurrency this project's own 500-case baseline run
    # already validated as scaling cleanly (near-linear up to 16-wide) on
    # this shared vLLM host.
    parallelism: 16
    scorer: "math_mas_default"

# n_hard_cases trimmed from the framework default (3) to 2 -- the narrative
# failure_summary.md below carries the cross-case synthesis; these are just
# 1-2 grounding examples now, not the sole evidence.
gatherer:
  type: "math_mas_default"
  config:
    n_hard_cases: 2

editor:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-2:8000/v1"
    max_attempts: 2

summarizer:
  type: "math_mas_default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-2:8000/v1"

# LLM-synthesized cross-case failure summary -- see
# meta_agent/failure_summarizer.py. Enabled here too, factored into the
# eval_budget sizing above (not free -- see size_eval_budget.py's
# --t-summarizer-pair modeling).
failure_summarizer:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-2:8000/v1"

# math_mas's own llm_client.py reads these directly -- this is the actual
# task-agent model, used for the predictor's/reflector's real LLM calls.
# Re-check this endpoint is still live before launching -- it rotates.
env:
  MAS_MODEL: "Qwen/Qwen3.5-35B-A3B"
  MAS_BASE_URL: "http://gpu-aic-mv-02-st-p5-node-1:8000/v1"
  MAS_API_KEY: "dummy"

# train_size = Y = 100 exactly (the per-agent evaluation target this run was
# framed around, not just a floor). eval_size kept at 50, same one-time-cost
# reasoning as configs/hgm_math_mas_full.yaml. Both randomly sampled and
# disjoint (compute_split does a genuine seeded shuffle of all 500 case ids).
split:
  seed: 42
  train_size: 100
  eval_size: 50

validators:
  - type: "syntax"
  - type: "signature"
  - type: "immutable_files"
  - type: "load_test"
