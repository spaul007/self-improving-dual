# Continuous-scoring sibling of configs/hgm_travel_deepseek27b_fromseed_agentic_X100Y300.yaml
# -- identical in every respect EXCEPT `project`/`evaluator.config.scorer`, which point at
# `travel_mas_refactored_flattened_scores` (a full clone of travel_mas_refactored, built per
# the plan at /users/v.kulkarni1/.claude/plans/let-us-implement-the-lazy-wand.md) instead of
# the original project.
#
# travel_mas_refactored_flattened_scores's scorer (TravelFlattenedScoresScorer) makes every
# component of the composite continuous (checks_passed/checks_total, no one-vote-veto AND-gate
# at any level -- see projects/travel_mas_refactored_flattened_scores/benchmark/_eval/
# eval_converted.py's calculate_weighted_score_continuous/calculate_hard_score_continuous),
# instead of travel_mas_refactored's own all-or-nothing dimension/hard-constraint scoring.
# The ORIGINAL gated numbers are ALSO always computed and kept in each case's `details` under
# `gated_*` keys (gated_composite_score etc.), so results stay comparable to every historical
# travel_mas_refactored run (node 10 at 0.6375, node 32 at 0.639, node 38 at 0.6510 clean 3x120,
# the seed at 0.5125) on the same scale -- see the plan's own "Comparability / reporting"
# section for the recommended follow-up (a standalone script averaging
# details["gated_composite_score"] per round, not built yet).
#
# travel_mas_refactored itself has ZERO modified bytes -- this is purely a new project/config
# pair pointed at its clone. Picking continuous-vs-gated scoring is just a matter of which
# `project:`/`scorer:` pair a config names; there is no runtime toggle (see the plan's
# "Known tradeoffs" section on TravelFlattenedScoresScorer's score_mode kwarg, which is
# Python-construction-only, for a regression-test hook, not YAML-reachable).
#
#   PYTHONPATH=. python3 main_loop.py --config configs/hgm_travel_flattened_scores_fromseed_agentic_X100Y300.yaml
#
# Confirm OpenRouter balance and the AIC-MV project disk quota (`lfs quota -p 1001 /groups`)
# before launching -- both have been tight in prior runs. Per the plan's verification section,
# launch on a small smoke budget first and hand-inspect a few round_NNN/eval_result.json files
# to confirm `details` carries both the native (continuous) and `gated_*` fields as expected,
# and that the seed round's gated_composite_score reproduces travel_mas_refactored's own seed
# composite (0.5125) as a live sanity check, before committing to a full X100Y300 run.

experiment_name: "travel_mas_refactored_flattened_scores_deepseek27b_fromseed_agentic_X100Y300"
project: "travel_mas_refactored_flattened_scores"
seed_dir_name: "seed_qwen27b_nothink"
verbose: true

mutable_exclude:
  - "workflow.py"
  - "benchmark/"
  - "agents/immutable/"

loop:
  max_rounds: 130
  score_target: 1.0

task_agent:
  model: "Qwen/Qwen3.8-27B"
  temperature: 0.2
  max_output_tokens: 16384
  base_url: "http://gpu-aic-mv-02-st-p5-node-6:8001/v1"

manager:
  type: "hgm_block_tagged"
  config:
    eval_budget: 30000
    init_expansions: 2
    alpha: 0.446716
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 60
    eval_repeats: 2  # >1 = repeats enabled (on/off switch, not a cap)
    finalize_top_k: 5
    full_eval_top_k: 0
    seed: 42
    block_selection_strategy: "adaptive"
    active_blocks:
      - "collaboration_workflow"
      - "foundation_capability"
      - "individual_subagent"
      - "mixed"
      - "verifiers"
    implementation_strategy_selection_strategy: "adaptive"
    # curriculum_enabled intentionally omitted (defaults to False) -- curriculum stays off.

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 3600
    memory_mb: 2048
    parallelism: 32
    scorer: "travel_mas_refactored_flattened_scores_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"
    n_hard_cases: 1

editor:
  type: "default"
  config:
    model: "deepseek/deepseek-v4-pro"
    base_url: "https://openrouter.ai/api/v1"
    reasoning_effort: "medium"
    max_output_tokens: 65536
    max_attempts: 2
    agentic_editing: true
    agentic_max_turns: 100
    agentic_tools:
      - "read_file"
      - "write_file"
      - "str_replace_file"
      - "grep"
      - "run_code_validators"
      - "run_python"
      - "list_cases"
      - "show_case"
      - "submit_self_improvement_summary"
      - "evaluate_variant"

failure_summarizer:
  type: "default"
  config:
    model: "deepseek/deepseek-v4-pro"
    base_url: "https://openrouter.ai/api/v1"
    reasoning_effort: "medium"

block_suggester:
  type: "default"
  config:
    model: "deepseek/deepseek-v4-pro"
    base_url: "https://openrouter.ai/api/v1"
    reasoning_effort: "medium"
    strategies_path: "strategies.md"
    agentic_access: true
    agentic_max_turns: 100
    agentic_tools:
      - "read_file"
      - "grep"
      - "list_cases"
      - "show_case"
      - "run_python"

env:
  META_AGENT_STRIP_REASONING: "1"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.8-27B"
  TRAVEL_CONVERT_BASE_URL: "http://gpu-aic-mv-02-st-p5-node-6:8001/v1"
  TRAVEL_CONVERT_ENABLE_THINKING: "false"

split:
  seed: 42
  train_size: 60
  eval_size: 60
  stratify_by: "meta_info.days"

validators:
  - type: "syntax"
  - type: "signature"
    config:
      workflow_filenames: ["workflow.py", "mas_workflow.py"]
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
  - type: "undefined_names"
  - type: "smoke_test"
