# Dual HGM (meta_agent/managers/hgm_dual.py's HGMDualManager) run on the
# travel_mas_refactored_gemma project, budget=4000. task_agent is
# Gemma-4-31B-IT via OpenRouter -- the SAME backbone + provider-routing
# fix (ignore DeepInfra, no bf16) as the two live production Gemma
# configs -- so this is a genuine Dual-HGM-vs-Block-HGM comparison on the
# identical task backbone. The meta-agent components (editor/
# failure_summarizer) stay on the pipeline's DEFAULT local vLLM server,
# same as every other config in this project family.
# Verified live before writing this config (curl .../v1/models -> HTTP
# 200) on 2026-09-15:
#   Qwen/Qwen3.5-122B-A10B @ http://gpu-aic-mv-02-st-p5-node-5:8000/v1 (editor/failure_summarizer)
# node-5 rotates over time -- re-verify with curl before reusing this
# config later; do not assume it's still live.
#
# NO ASPECT OF BLOCK HGM IS ENABLED, by explicit request:
#   - manager.type is "hgm_dual", not "hgm_block_tagged".
#   - block_selection_strategy is left UNSET, which defaults to the fixed
#     "collaboration" strategy (meta_agent/managers/hgm.py::_select_block)
#     -- always the same "collaboration_workflow" block label, no
#     Thompson-sampling bandit, no per-block success/failure tracking,
#     no active_blocks restriction. This is the block-selection behavior
#     that predates the block-tiered/adaptive-bandit feature entirely
#     (see configs/hgm_dual_travel_4000_qwen35b_node6.yaml, the proven
#     budget=4000 hgm_dual reference this config is modeled on).
#   - No `block_suggester:` section at all -- the per-block steering-prose
#     component (and its backbone_catalog / llm_backbone_selection block)
#     is entirely absent from this run.
#   - No "llm_backbone_config" validator -- inert without block_suggester,
#     omitted for the same reason.
#
# eval_batch_size/intra_expand_eval_size/min_remaining_budget_for_dual are
# 16 (not the 32 the two live 18000-budget production configs use) --
# following configs/hgm_dual_travel_4000_qwen35b_node6.yaml's own choice
# at this exact budget scale, so more distinct EXPANDs fit in the smaller
# 4000-eval budget. evaluator.parallelism is 32, matching the two live
# production Gemma configs, since task_agent now goes through OpenRouter
# (which absorbs arbitrary concurrency) rather than a shared local vLLM
# server -- the "keep parallelism low, a local vLLM server can fall over"
# reasoning from the all-local-vLLM version of this config no longer
# applies to the evaluator side. variant_parallelism (Stage B editor
# calls, which DO hit the shared local vLLM node-5) stays conservative at
# 2, same as before.
#
# Split (train/eval case ids) matches the two live OpenRouter/Gemma runs
# exactly (same seed=42, train_size=60, eval_size=60, stratify_by --
# deterministic partition), so this run's cases are directly comparable
# to theirs despite the different task_agent backbone.
#
#   set -a && source /groups/AIC-MV/v.kulkarni1/.env && set +a
#   PYTHONPATH=. python3 main_loop.py --config configs/hgm_travel_gemma_dual_budget4000_X100Y180.yaml

experiment_name: "travel_mas_refactored_gemma_dual_hgm_budget4000"
project: "travel_mas_refactored_gemma"

mutable_exclude:
  - "workflow.py"
  - "benchmark/"
  - "agents/immutable/"

loop:
  max_rounds: 200
  score_target: 1.0

task_agent:
  model: "google/gemma-4-31b-it"
  temperature: 0.2
  max_output_tokens: 16384
  base_url: "https://openrouter.ai/api/v1"
  # Same OpenRouter provider-routing fix as the two live production
  # configs (configs/hgm_travel_gemma_full_scale_block_tagged_X100Y180.yaml
  # / hgm_travel_gemma_no_backbone_selection_X100Y180.yaml) -- ignore
  # DeepInfra (the NVFP4-quantized backend that caused status="failed"
  # responses), no bf16 requirement (breaks unrelated here since this
  # config has no llm_backbone_selection block anyway, but kept identical
  # to the proven production fix for consistency). Re-validated 3x/32-case
  # reliability: 0 terminal failures / 1075 calls, 0.09% incidence
  # (deepinfra_only_3x_32/).
  provider:
    ignore: ["DeepInfra"]
    allow_fallbacks: false

manager:
  type: "hgm_dual"
  config:
    eval_budget: 4000
    init_expansions: 2
    alpha: 0.470005
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 16
    finalize_top_k: 5
    full_eval_top_k: 0
    seed: 42
    # block_selection_strategy intentionally omitted -- defaults to the
    # fixed "collaboration" strategy (see header note above). NOT
    # "adaptive"/"non_adaptive", and no active_blocks -- no aspect of
    # Block HGM is enabled in this run.

    # --- hgm_dual-specific (values match the proven budget=4000
    # reference, configs/hgm_dual_travel_4000_qwen35b_node6.yaml) ---
    num_variants: 2
    intra_expand_eval_size: 16
    variant_parallelism: 2
    select_metric: "mean"
    categorizer_max_representative_errors: 5
    min_remaining_budget_for_dual: 16
    category_selection: "balanced_by_type"
    category_types: ["commonsense", "hard_constraint"]
    snapshot_tree: true
    # Required by HGMDualManager itself (category-balanced variant
    # selection) -- distinct from gatherer.config.error_categorizer below
    # (which feeds the failure-digest text), same underlying function.
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 3600
    memory_mb: 2048
    parallelism: 32
    scorer: "travel_mas_refactored_gemma_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"
    n_hard_cases: 1

editor:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
    max_attempts: 2

failure_summarizer:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

# No block_suggester section -- see header note. No aspect of Block HGM
# is enabled in this run.

env:
  META_AGENT_STRIP_REASONING: "1"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-35B-A3B"

split:
  seed: 42
  train_size: 60
  eval_size: 60
  stratify_by: "meta_info.days"

validators:
  - type: "syntax"
  - type: "signature"
    config:
      workflow_filenames: ["workflow.py", "mas_workflow.py"]
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
  - type: "undefined_names"
  - type: "smoke_test"
