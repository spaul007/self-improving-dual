# Identical to hgm_travel_gemma_no_backbone_selection_X100Y180.yaml (the
# live OFF run) with exactly ONE change: manager.config.eval_batch_size
# 32 -> 60, matching split.train_size exactly, so every EVALUATE/EXPAND
# batch covers the FULL 60-case train set instead of a random 32-case
# subset.
#
# Rationale (2026-09-15 investigation, this session): decomposed the
# per-case score variance across 3 independent full-120-case re-runs of
# both the seed and a live node (node_18). Found it's sharply bimodal --
# just 13 of the 60 train cases (22%) account for 88% of ALL single-draw
# noise in the benchmark; the other 47 (78%) are highly consistent
# (near-zero variance across repeats). A random 32-case batch draws ~7 of
# those 13 volatile cases on average, and since each is typically drawn
# only once, whatever that single draw happens to land on for those ~7
# cases dominates the whole batch's reported score -- a Monte Carlo
# simulation (same per-case means/variances, no code change) showed 90%
# of random 32-case batches land within a 0.11-wide band purely from
# which cases got drawn + luck on the volatile subset. This is larger
# than most of the gaps observed this session between a node's live
# HGM-tree mean_utility and an independent full-120-case re-evaluation of
# that exact same code (e.g. node_18: 0.57 live vs ~0.51 standalone;
# node_11: 0.63 vs 0.61).
#
# Full per-batch coverage (this config) removes the case-SELECTION
# component of that noise entirely -- every batch sees the exact same 60
# cases every time, so batch-to-batch differences in a node's reported
# score can only come from genuine code-quality differences plus the
# (much smaller) within-case decoding-stochasticity component, not from
# which subset of cases happened to be sampled. Empirically estimated
# SE(mean) at full 60-case coverage is ~0.033 vs ~0.045 at n=32 (see this
# session's variance-decomposition analysis) -- most of the available
# noise reduction from full coverage, without the steeply-diminishing-
# returns cost of ALSO repeating every case 2-3x (eval_repeats is left
# unchanged at 2 below; a second full-60 top-up if a node gets widened
# further still costs far less than the first).
#
# Cost tradeoff: each initial batch now costs 60 evals instead of 32, so
# roughly half as many distinct EXPANDs fit in the same eval_budget=18000
# -- fewer, but far more reliably-scored, node evaluations.
#
# OPENAI_API_KEY MUST be a real OpenRouter key before launch (source
# /groups/AIC-MV/v.kulkarni1/.env with `set -a`) -- the task_agent default
# alone still goes through OpenRouter for every case, even with backbone
# selection off.
#
#   set -a && source /groups/AIC-MV/v.kulkarni1/.env && set +a
#   PYTHONPATH=. python3 main_loop.py --config configs/hgm_travel_gemma_no_backbone_selection_fullbatch60_X100Y180.yaml

experiment_name: "travel_mas_refactored_gemma_no_backbone_selection_fullbatch60_X100Y180"
project: "travel_mas_refactored_gemma"

mutable_exclude:
  - "workflow.py"
  - "benchmark/"
  - "agents/immutable/"

loop:
  max_rounds: 130
  score_target: 1.0

task_agent:
  model: "google/gemma-4-31b-it"
  temperature: 0.2
  max_output_tokens: 16384
  base_url: "https://openrouter.ai/api/v1"
  # OpenRouter provider-routing preference -- excludes DeepInfra.
  # Added 2026-09-13 after this session traced the OpenRouter
  # status="failed" reliability issue to DeepInfra + an
  # NVFP4-quantized backend (see openrouter_failure_report.md);
  # confirmed live that OpenRouter honors this field (a test call
  # with ignore=["DeepInfra"] was served by Venice instead), and
  # validated at production scale -- 3x independent 120-case passes
  # at parallelism 32, 0 terminal failures out of 3511 real calls
  # (round013_provider_fix_3x_120/).
  #
  # NOTE (2026-09-14): the original fix also required quantizations:
  # ["bf16"] -- dropped after discovering live that ALL FOUR
  # llm_backbone_selection catalog slugs (qwen/qwen3.6-27b,
  # qwen/qwen3.8-27b, google/gemini-3.6-flash, google/gemini-3.8-flash)
  # 404 under a bf16 requirement ("No endpoints found for the
  # request with quantization: bf16") -- confirmed live, one-off
  # calls to each. ignore-DeepInfra-only was independently
  # re-validated for reliability before this change: 3x independent
  # 32-case passes, 0 terminal failures out of 1075 real calls, 0.09%
  # incidence rate (deepinfra_only_3x_32/) -- as good as the
  # bf16-included version's 0.20%, while no longer blocking any
  # backbone-catalog model.
  provider:
    ignore: ["DeepInfra"]
    allow_fallbacks: false

manager:
  type: "hgm_block_tagged"
  config:
    eval_budget: 18000
    init_expansions: 2
    alpha: 0.470005
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    # The one deliberate change vs. the live OFF run -- see header.
    # Matches split.train_size exactly, so every batch is the full
    # train set, not a random subset.
    eval_batch_size: 60
    eval_repeats: 2  # >1 = repeats enabled (on/off switch, not a cap)
    finalize_top_k: 5
    full_eval_top_k: 0
    seed: 42
    block_selection_strategy: "adaptive"
    # The one deliberate difference vs. the Gemma run -- see header.
    active_blocks:
      - "individual_subagent"
      - "collaboration_workflow"
      - "foundation_capability"
      - "verifiers"
      - "mixed"
    # Curriculum stays OFF (curriculum_enabled defaults to False).

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 3600
    memory_mb: 2048
    parallelism: 32
    scorer: "travel_mas_refactored_gemma_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"
    n_hard_cases: 1

editor:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
    max_attempts: 2
    # Opt-in agentic loop: lets the editor read_file/grep the actual
    # workspace (code, logs, trace.jsonl) before proposing its edit,
    # instead of only seeing the pre-built feedback report.
    agentic_editing: true

failure_summarizer:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

block_suggester:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
    strategies_path: "strategies.md"
    # Opt-in agentic loop: lets the block suggester read_file/grep the
    # actual workspace (code, logs, trace.jsonl) before writing its
    # steering prose, instead of only seeing the pre-built feedback report.
    agentic_access: true
    # Inert here -- llm_backbone_selection can never be selected (see
    # manager.config.active_blocks above) -- left in place only for a
    # byte-for-byte "identical except active_blocks" diff.
    backbone_catalog:
      - slug: "qwen/qwen3.6-27b"
        note: "newer generation, smaller than the pipeline default"
      - slug: "qwen/qwen3.8-27b"
        note: "newest Qwen generation available"
      - slug: "google/gemini-3.6-flash"
        note: "different provider, newer Gemini generation"
      - slug: "google/gemini-3.8-flash"
        note: "different provider, newest Gemini generation"

env:
  META_AGENT_STRIP_REASONING: "1"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-35B-A3B"

split:
  seed: 42
  train_size: 60
  eval_size: 60
  stratify_by: "meta_info.days"

validators:
  - type: "syntax"
  - type: "signature"
    config:
      workflow_filenames: ["workflow.py", "mas_workflow.py"]
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
  - type: "undefined_names"
  - type: "llm_backbone_config"
  - type: "smoke_test"
