# Second live sanity check for the curriculum feature, re-run after two
# fixes made since the first pass (configs/hgm_travel_mas_refactored_curriculum_sanity.yaml):
#   1. meta_agent/curriculum.py::Curriculum.failure_rate_for now corrects
#      its denominator for no-plan/crashed cases (no_plan_rate), instead
#      of letting a 100%-crashed node falsely read as "check resolved".
#   2. The "no plan" error message (projects/travel_mas_refactored/adapter/
#      scorer_impl.py) now folds in the agent's own agent_metadata instead
#      of a bare, indistinguishable "agent produced no plan"; and
#      meta_agent/failure_summarizer.py._aggregate now reads
#      details["error"] (where that message actually lives) instead of
#      CaseResult's top-level .error (always None for a scorer-judged
#      failure, so the fix was previously invisible to the LLM-facing
#      failure digest entirely).
#
# Same single forced sub-goal as the first run (curriculum_goals_override):
# commonsense:Sandbox Compliance:validated_meals -- see that config's own
# header comment for why this check was picked.
#
# What's different this time:
#   - train_size cut 24 -> 10 (and eval_budget/eval_batch_size scaled down
#     to match) so the whole run is faster and each individual EXPAND's
#     block_suggestion_prompt.txt / failure_summary.md is small enough to
#     read in full by hand -- the explicit goal of this re-run is to
#     manually verify each node sees the CORRECTED, distinguishing error
#     text (not just that the mechanism completes end to end, already
#     confirmed by the first pass).
#
#   PYTHONPATH=. python3 main_loop.py --config configs/hgm_travel_mas_refactored_curriculum_sanity_v2.yaml
#
# Double-check the task_agent/editor vLLM endpoints below against whatever's
# actually live before running.

experiment_name: "travel_mas_refactored_curriculum_sanity_v2"
project: "travel_mas_refactored"

mutable_exclude:
  - "workflow.py"
  - "benchmark/"
  - "agents/immutable/"

loop:
  max_rounds: 14
  score_target: 1.0

task_agent:
  model: "Qwen/Qwen3.5-35B-A3B"
  temperature: 0.2
  max_output_tokens: 16384
  base_url: "http://gpu-aic-mv-02-st-p5-node-6:8000/v1"

manager:
  type: "hgm"
  config:
    eval_budget: 40
    init_expansions: 1
    alpha: 0.6
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 4
    finalize_top_k: 1
    full_eval_top_k: 0
    seed: 42
    block_selection_strategy: "adaptive"
    curriculum_enabled: true
    curriculum_resolution_threshold: 0.15
    curriculum_patience: 4
    curriculum_goals_override:
      - "commonsense:Sandbox Compliance:validated_meals"

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 3600
    memory_mb: 2048
    parallelism: 8
    scorer: "travel_mas_refactored_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"
    n_hard_cases: 1

editor:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
    max_attempts: 2

summarizer:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

failure_summarizer:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

block_suggester:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
    strategies_path: "strategies.md"

env:
  META_AGENT_STRIP_REASONING: "1"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-35B-A3B"

split:
  seed: 42
  train_size: 10
  eval_size: 0

validators:
  - type: "syntax"
  - type: "signature"
    config:
      workflow_filenames: ["workflow.py", "mas_workflow.py"]
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
  - type: "undefined_names"
  - type: "smoke_test"
