# EVAL-ONLY config: task agent on OpenRouter ~deepseek/deepseek-v4-flash-latest
# (alias; resolved to deepseek/deepseek-v4-flash-0731 when verified on
# 2026-08-28) at reasoning_effort MEDIUM. Scorer conversion stays on the
# LOCAL vLLM node-5 Qwen/Qwen3.5-122B-A10B — identical to
# eval_local_qwen122b_medium.yaml — so scoring is comparable with the
# 20260827 Qwen evals; only the task agent changes.
#
# For snapshot_eval.py over the 20260827 OpenRouter A/B pair
# (…_or_medium_no_editmem / …_or_medium_editmem): cross-model transfer of
# each arm's best agent (prompt-only node 31 vs verify-loop node 27).
#
# Slug/tools/reasoning_effort verified live through the chat completions
# endpoint (tool_calls returned, reasoning tokens billed, no 400).
#
# COLLISION NOTE: the 20260827 Qwen evals are (were) live under
# snapshots/eval_runs/lcb_full_benchmark/budget_99999999/run_{1,2}.
# snapshot_eval's _isolated_round_dir rmtree's an existing dir at the same
# label, so launch THIS config with BOTH:
#   --at-budget 99999998            -> budget_99999998/... dirs +
#                                      eval_at_budget_99999998.json
#   --case-ids 0,1,...,119          -> case_set "custom": logs under
#                                      eval_runs/lcb_custom/... and CSV
#                                      budget_curve_lcb_custom.csv
# (the full 120-id list IS the full benchmark; "custom" only renames paths).
#
# AUTH: platform_core/llm_wrapper.py reads ONE global OPENAI_API_KEY for every
# LLM site. Export the OpenRouter key as OPENAI_API_KEY before launching
# (AFTER sourcing api.sh, which sets OPENAI_API_KEY to the real OpenAI key).
experiment_name: "travel_eval_dsv4flash_latest_medium"

project: "travel"

eval_visibility: "blackbox"

loop:
  max_rounds: 1000
  score_target: 0.99

task_agent:
  model: "~deepseek/deepseek-v4-flash-latest"
  reasoning_effort: "medium"
  base_url: "https://openrouter.ai/api/v1"

manager:
  type: "hgm"
  config:
    eval_budget: 1000
    init_expansions: 3
    alpha: 0.5
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 16
    finalize_top_k: 3
    snapshot_tree: true
    seed: 42

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 1800
    memory_mb: 2048
    parallelism: 16
    scorer: "travel_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"

# editor unused by snapshot_eval; kept for config-schema completeness.
editor:
  type: "default"
  config:
    model: "~deepseek/deepseek-v4-flash-latest"
    reasoning_effort: "medium"
    max_attempts: 2
    base_url: "https://openrouter.ai/api/v1"

env:
  META_AGENT_STRIP_REASONING: "1"
  # Conversion is part of evaluation; keep it on the local Qwen node so the
  # scoring pipeline matches the Qwen evals exactly.
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-122B-A10B"
  TRAVEL_CONVERT_BASE_URL: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

split:
  train_ids_path: "configs/travel_train_ids.json"   # 60 predetermined cases

validators:
  - type: "syntax"
  - type: "signature"
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
