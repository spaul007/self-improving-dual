# A proper (not sanity-check) HGM run against math_mas: 100 train / 50 eval
# cases (randomly sampled out of the full 500), sized to typically finish in
# roughly 10-11 hours based on this session's own measured throughput.
#
#   PYTHONPATH=. python3 main_loop.py --config configs/hgm_math_mas_full.yaml
#
# --- How eval_budget was sized (worked out from real data, not guessed) ---
#
# Empirical throughput: a full 500-case baseline run of the unmodified seed
# (see projects/math_mas/math_mas/results/scored/baseline_full.json) took
# 1264s wall-clock at MAS_MAX_CONCURRENT_TASKS=16 (native asyncio
# concurrency, no framework subprocess overhead) -- 2.528 s/case aggregate
# throughput. That run's own summary: accuracy=0.78, predictor_accuracy=0.90,
# fixed_by_reflector=12, broken_by_reflector=72 (avg_elapsed_s=39.6 per case
# -- the ~15x gap between per-case latency and aggregate throughput confirms
# the concurrency was scaling cleanly, not badly host-contended).
#
# Non-obvious extra cost #1: with behavior_summarizer AND failure_summarizer
# both enabled, EVERY EVALUATE step fires two extra meta-agent LLM calls --
# at a small eval_batch_size this would mean thousands of extra 122B-model
# calls, easily dominating the whole time budget. eval_batch_size is set to
# 50 (half of train_size) specifically to keep the number of EVALUATE steps
# (and therefore summarizer calls) small relative to eval_budget, while
# still giving the bandit reasonably frequent feedback.
#
# Non-obvious extra cost #2: finalize_top_k/full_eval_top_k=3 (bumped from
# 1 -- see the design discussion this was decided in) means the end-of-run
# sidecar audit is no longer cheap. The framework's own winner selection is
# ALWAYS decided from train-only LCB before the eval set is ever touched
# (confirmed directly in hgm.py::_finalize -- best_id is fixed, then
# _run_eval_split/_run_top_k_full_eval only ever AUDIT that already-chosen
# node plus, now, 2 runner-up candidates) -- raising top_k to 3 doesn't
# change what gets selected, it buys a genuine comparison: enough data to
# notice if a runner-up actually generalizes better than the train-selected
# "winner" and manually prefer it (via evaluate_task_agent.py, pointed at
# that other round's task_agent/) even though the framework itself would
# still report the train-based pick as best_round.
# Fixed unbudgeted-eval cost with these settings: seed pre-eval (100,
# train_size) + finalize_top_k=3 worst case (3*100=300, top-3 topped up to
# full train coverage) + eval-related audits (~200: _run_eval_split's 50 for
# the winner, plus full_eval_top_k=3's eval-portion for the top 3, train
# portion already covered by finalize) ~= 600 evals of one-time overhead --
# a real jump from an earlier top_k=1 version's ~150, factored in below.
#
# Budget equation solved (t_case=2.528s at parallelism=16; ~15s per
# EVALUATE-step summarizer pair; ~30s per EXPAND editor call, max_rounds=100
# worst case; ~600 fixed unbudgeted evals per the breakdown above):
#   eval_budget=12000 -> projected ~10.7h total (case-eval ~8.4h, summarizer
#   overhead ~1.0h, ~1.3h buffer under the 12h target for the real
#   host-contention variability this session repeatedly observed on this
#   shared vLLM endpoint). Treat 12h as an approximate target, not a
#   guarantee -- re-check actual progress partway through and adjust a
#   future run's eval_budget from the real observed throughput if it's off.
#   Recomputed via: python3 size_eval_budget.py --t-case 2.528 --hours 12
#     --eval-batch-size 50 --max-rounds 100 --fixed-unbudgeted-evals 600

experiment_name: "math_mas_hgm_full"

project: "math_mas"
seed_dir_name: "math_mas"

# Same exclude-list as the sanity config -- see configs/hgm_math_mas_sanity.yaml
# for the full rationale on each entry.
mutable_exclude:
  - "tools/immutable/"
  - "eval/"
  - "workflow.py"
  - "benchmark/"

tool_source_dirs:
  - "tools"
  - "agents"

loop:
  # Deliberately generous -- eval_budget is meant to be the actual
  # time-determining constraint for this run, not max_rounds. 100 real edit
  # attempts is far more than the bandit is likely to need against a 50-case
  # train set, but costs nothing to allow for.
  max_rounds: 100
  score_target: 1.0

manager:
  type: "hgm"
  config:
    eval_budget: 12000
    init_expansions: 1
    alpha: 0.6
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    # 50 (half the 100-case train set) per EVALUATE step -- keeps the number
    # of summarizer-triggering EVALUATE steps (eval_budget / eval_batch_size
    # = 240) from dominating the time budget; see the sizing note above.
    eval_batch_size: 50
    # Bumped from 1: top-3 candidates (by current train mean) get topped up
    # to full train coverage before final selection, not just the single
    # provisional leader -- gives the eval-audit step (below) more than one
    # real candidate to compare.
    finalize_top_k: 3
    # Bumped from 1 for the same reason: audits the top-3 finalists on the
    # combined train+eval set, not just the train-selected winner -- lets
    # you manually notice (and prefer) a runner-up that generalizes better,
    # even though the framework's own best_round is still the train-only
    # LCB pick regardless of what this audit shows (see the note above).
    full_eval_top_k: 3
    seed: 42

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 600
    memory_mb: 1024
    # Bumped from the sanity config's 2 -- matches the concurrency our real
    # 500-case baseline run already validated as scaling cleanly (near-linear
    # up to 16-wide) on this same shared vLLM host.
    parallelism: 16
    scorer: "math_mas_default"

# n_hard_cases trimmed from the framework default (3) to 2 -- the narrative
# failure_summary.md below carries the cross-case synthesis; these are just
# 1-2 grounding examples now, not the sole evidence.
gatherer:
  type: "math_mas_default"
  config:
    n_hard_cases: 2

editor:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-2:8000/v1"
    max_attempts: 2

summarizer:
  type: "math_mas_default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-2:8000/v1"

# LLM-synthesized cross-case failure summary -- see
# meta_agent/failure_summarizer.py and configs/hgm_math_mas_sanity.yaml's
# own note on why this exists. Enabled here too, factored into the
# eval_budget sizing above (not free -- see the sizing note).
failure_summarizer:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-2:8000/v1"

# math_mas's own llm_client.py reads these directly -- this is the actual
# task-agent model, used for the predictor's/reflector's real LLM calls.
# Re-check this endpoint is still live before launching -- it rotates.
env:
  MAS_MODEL: "Qwen/Qwen3.5-35B-A3B"
  MAS_BASE_URL: "http://gpu-aic-mv-02-st-p5-node-1:8000/v1"
  MAS_API_KEY: "dummy"

# 100 train / 50 eval, both randomly sampled (compute_split does a genuine
# seeded shuffle of all 500 case ids, then slices train/eval from it --
# reproducible from this seed alone, and the two sets are disjoint).
# train_size bumped 50->100 (tighter search signal: at p~0.78, 95% CI on any
# node's train mean shrinks from +/-11.5pp at n=50 to +/-8.1pp at n=100).
# eval_size LEFT AT 50 here -- not explicitly requested to change alongside
# train_size, flagging this assumption; bump it too (e.g. to 100-150) if a
# tighter final generalization number is wanted, same low-cost reasoning as
# before (eval_size is a one-time cost, not paid per round).
split:
  seed: 42
  train_size: 100
  eval_size: 50

validators:
  - type: "syntax"
  - type: "signature"
  - type: "immutable_files"
  - type: "load_test"
