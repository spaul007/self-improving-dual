# Production two-tier Block-Tagged HGM run: implementation_strategy axis (tier 1: llm_heavy /
# mixed / harness_heavy) + block axis (tier 2: individual_subagent / collaboration_workflow /
# foundation_capability / verifiers / mixed), both adaptive (Thompson sampling). Curriculum stays
# OFF (curriculum_enabled defaults to False -- not set here). llm_backbone_selection is disabled
# OUTRIGHT via active_blocks (a static, whole-run exclusion), not just dynamically excluded when
# harness_heavy is sampled -- per explicit request, the block is never a candidate at all here.
#
# Meta-agent (editor): DeepSeek V4 Pro via OpenRouter. Task agent: Qwen/Qwen3.8-27B, local vLLM,
# enable_thinking=False via seed_dir_name: "seed_qwen27b_nothink" (projects/travel_mas_refactored/
# seed_qwen27b_nothink/ -- identical to seed/ except mas_llm_backbone.yaml's
# default.enable_thinking=false + the matching agents/llm_backbone.py _FIELDS addition; verified
# workspace_problems()-clean against seed/ earlier this session). Auxiliary roles (summarizer/
# failure_summarizer/block_suggester) stay on local Qwen3.5-122B for cost, matching this session's
# established convention -- only the editor (the actual self-modifying role) is DeepSeek.
#
# X/Y sizing: X=100 target good-enough agents, Y=300 evals each on average (5 full passes over
# the 60-case train set per node on average): eval_budget=X*Y=30000,
# alpha=ln(100)/ln(30000)=0.446716 (so eval_budget**alpha==100 by construction, same
# solve-for-alpha convention as every other X*Y-sized config). max_rounds=130 still clears both of
# HGMManager.evolve()'s asserts (130 > eval_budget**alpha=100, and 130 > 1+init_expansions=3) --
# unchanged from the eval_budget=18000 sizing since eval_budget**alpha==100 regardless of Y by
# construction. eval_batch_size=60 (== train_size, so one EVALUATE batch can cover a full pass over
# the whole train set) -- raised from the original template's 32; parallelism=32 carried over from
# that config's own measured-throughput rationale, NOT re-measured for Qwen3.8-27B specifically --
# re-check node-6 capacity/throughput before a long run if this matters.
#
#   PYTHONPATH=. python3 main_loop.py --config configs/hgm_travel_deepseek27b_two_tier_no_curriculum_no_backbone_X100Y180.yaml
#
# Double-check the task_agent/editor endpoints below against whatever's actually live before
# running -- this is a long, expensive run. node-6:8000 and :8001 have both been observed serving
# Qwen3.8-27B (not 35B) as of 2026-09-25; TRAVEL_CONVERT_MODEL below is pointed at the 122B
# endpoint on node-5 for the same reason (see env: comment).

experiment_name: "travel_mas_refactored_deepseek27b_two_tier_no_curriculum_no_backbone_X100Y180"
project: "travel_mas_refactored"
seed_dir_name: "seed_qwen27b_nothink"

mutable_exclude:
  - "workflow.py"
  - "benchmark/"
  - "agents/immutable/"

loop:
  max_rounds: 130
  score_target: 1.0

task_agent:
  model: "Qwen/Qwen3.8-27B"
  temperature: 0.2
  max_output_tokens: 16384
  base_url: "http://gpu-aic-mv-02-st-p5-node-6:8001/v1"

manager:
  type: "hgm_block_tagged"
  config:
    eval_budget: 30000
    init_expansions: 2
    alpha: 0.446716
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 60
    eval_repeats: 2  # >1 = repeats enabled (on/off switch, not a cap)
    finalize_top_k: 5
    full_eval_top_k: 0
    seed: 42
    # Tier 2 (block): adaptive Thompson sampling, restricted to every block EXCEPT
    # llm_backbone_selection -- disabled outright for this whole run, not just when
    # implementation_strategy="harness_heavy" (which would only exclude it dynamically).
    block_selection_strategy: "adaptive"
    active_blocks:
      - "collaboration_workflow"
      - "foundation_capability"
      - "individual_subagent"
      - "mixed"
      - "verifiers"
    # Tier 1 (implementation_strategy): adaptive Thompson sampling over llm_heavy/mixed/
    # harness_heavy. Orthogonal to block above; both apply to the same EXPAND together. When
    # harness_heavy is sampled, llm_backbone_selection would ALSO be dynamically excluded from
    # block candidates -- redundant here since active_blocks above already removes it entirely,
    # but this is the same mechanism that matters when active_blocks is unset elsewhere.
    implementation_strategy_selection_strategy: "adaptive"
    # curriculum_enabled intentionally omitted (defaults to False) -- curriculum stays off.

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 3600
    memory_mb: 2048
    parallelism: 32
    scorer: "travel_mas_refactored_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"
    n_hard_cases: 1

editor:
  type: "default"
  config:
    model: "deepseek/deepseek-v4-pro"
    base_url: "https://openrouter.ai/api/v1"
    reasoning_effort: "medium"
    max_output_tokens: 65536
    max_attempts: 2

summarizer:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

failure_summarizer:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

block_suggester:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
    strategies_path: "strategies.md"

env:
  META_AGENT_STRIP_REASONING: "1"
  # TEMPORARY: Qwen3.5-35B-A3B is not served on node-6 as of 2026-09-25 (both :8000 and :8001
  # serve Qwen3.8-27B) -- scorer's plan-to-JSON conversion step points at the 122B endpoint on
  # node-5 instead. Not directly comparable to any earlier baseline that used the 35B converter.
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-122B-A10B"
  TRAVEL_CONVERT_BASE_URL: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

split:
  seed: 42
  train_size: 60
  eval_size: 60
  stratify_by: "meta_info.days"

validators:
  - type: "syntax"
  - type: "signature"
    config:
      workflow_filenames: ["workflow.py", "mas_workflow.py"]
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
  - type: "undefined_names"
  - type: "smoke_test"
