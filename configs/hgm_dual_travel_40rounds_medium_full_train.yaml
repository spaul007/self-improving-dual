experiment_name: "travel_hgm_dual_40rounds_medium_full_train"

# Cloned from hgm_dual_travel_20rounds_medium.yaml. Differences:
#   - train_size: 120 (all benchmark cases used for optimization, no held-out)
#   - max_rounds: 40 (was 30) — more nodes possible with the larger train pool
#   - eval_budget: 2800 (was 2000) — covers 40 expansions × 48 + ~40 bandit
#     evaluates × 16 + finalize_top_k top-up to full 120 (free)
#   - alpha: 0.42 (was 0.50) — tuned so expand-evaluate interleave starts ~N=15
#   - full_eval_top_k: 0 (was 3) — no held-out cases to audit on
#
# Since train_size == benchmark size, _run_eval_split is a no-op and the LCB
# winner's "final_score" reflects the entire 120-case benchmark.
project: "travel"

loop:
  max_rounds: 40                                      # was 30
  score_target: 0.95

task_agent:
  model: "gpt-5.4-mini"
  reasoning_effort: "high"

manager:
  type: "hgm_dual"
  config:
    eval_budget: 2800                                 # was 2000
    init_expansions: 3
    alpha: 0.42                                       # was 0.50 — tuned for synergy at 40 rounds
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 16
    finalize_top_k: 3
    full_eval_top_k: 0                                # was 3 — no held-out, audit redundant
    seed: 42

    num_variants: 2
    intra_expand_eval_size: 16
    variant_parallelism: 2
    select_metric: "mean"
    categorizer_max_representative_errors: 5
    min_remaining_budget_for_dual: 16
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"
    category_selection: "balanced_by_type"

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 1800
    memory_mb: 2048
    parallelism: 10
    scorer: "travel_default"

gatherer:
  type: "default"
  config: {}

editor:
  type: "default"
  config:
    model: "gpt-5.4"
    reasoning_effort: "medium"
    max_attempts: 2

summarizer:
  type: "default"
  config:
    model: "gpt-5.4"
    reasoning_effort: "medium"

split:
  seed: 42
  train_size: 120                                     # was 60 — all benchmark cases used for optimization

validators:
  - type: "syntax"
  - type: "signature"
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
