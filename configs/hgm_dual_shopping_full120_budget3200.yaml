experiment_name: "shopping_hgm_dual_full120_budget3200"

# hgm_dual on shopping, optimizing over ALL 120 benchmark cases (no
# train/eval split holdout). Same knobs as
# hgm_dual_shopping_30rounds_medium except: split.train_size=120 (full
# optimization sample), eval_budget=3200, and a loose max_rounds so the
# run terminates on the eval budget rather than the round cap.
project: "shopping"

loop:
  # Loose cap; eval_budget is the real terminator. Editor failures consume a
  # node slot but zero eval budget.
  max_rounds: 1000
  score_target: 0.95

task_agent:
  model: "gpt-5.4-mini"
  reasoning_effort: "high"

manager:
  type: "hgm_dual"
  config:
    eval_budget: 3200
    init_expansions: 3
    alpha: 0.5
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 16        # bandit top-up batch (matches original HGM)
    finalize_top_k: 3
    full_eval_top_k: 3         # top-3 finalists each scored on all 120 cases
    seed: 42

    # Dual-optimization knobs.
    num_variants: 2                                    # 2 Stage B variants per expansion
    intra_expand_eval_size: 16                         # cases per candidate (Stage A + each variant)
    variant_parallelism: 2
    select_metric: "mean"                              # composite-mean winner (variance tiebreak)
    categorizer_max_representative_errors: 5
    min_remaining_budget_for_dual: 16
    error_categorizer: "projects.shopping.shopping_error_categorizer:categorize_errors"
    category_selection: "top_failure_rate"             # variants target the TOP failure-rate categories (NOT balanced)

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 1800
    memory_mb: 2048
    parallelism: 16
    scorer: "shopping_default"

gatherer:
  type: "default"
  config: {}

editor:
  type: "default"
  config:
    model: "gpt-5.4"
    reasoning_effort: "medium"
    max_attempts: 2

summarizer:
  type: "default"
  config:
    model: "gpt-5.4"
    reasoning_effort: "medium"

# Shopping data is local at projects/shopping/data — _db.database_root() falls
# back to it when SHOPPING_DATABASE_ROOT is unset, so no env override is needed.

# Optimize over ALL 120 cases (train_size=120 -> empty held-out sidecar).
split:
  seed: 42
  train_size: 120

validators:
  - type: "syntax"
  - type: "signature"
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
