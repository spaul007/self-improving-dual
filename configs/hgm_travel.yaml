experiment_name: "travel_hgm"

# Output location. Run folders default to repo-local `runs/`. Redirect them
# to a larger filesystem when the local disk is small — either uncomment
# runs_root here, or set the META_AGENT_RUNS_ROOT env var (SLURM job logs
# are separate: the SLURM_LOG_DIR env var). slurm/run_hgm.sh sets both.
#   runs_root: /groups/AIC-MV/n.tzou/meta-agent/runs

# HGM (Huxley-Gödel Machine) tree-search optimization of the travel agent.
# Same project assets as configs/travel.yaml — only the manager differs.
project: "travel"

# Evaluation visibility for the meta-agent editor: "blackbox" (default — sees
# the agent's code, tool implementations, DB schema, and behavioral failure
# examples, but NOT the scoring code) or "whitebox" (also injects the scorer
# source). Ground-truth data is never exposed in either mode.
eval_visibility: "blackbox"

loop:
  # HGM's real terminator is `manager.config.eval_budget`; max_rounds is
  # only a hard cap on tree size (node count).
  max_rounds: 60
  score_target: 0.95

task_agent:
  model: "gpt-5.4-mini"
  reasoning_effort: "high"

manager:
  type: "hgm"
  config:
    eval_budget: 400         # agent-task evaluations (the real budget)
    init_expansions: 5
    alpha: 0.5
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 16      # match evaluator.parallelism for SLURM throughput
    finalize_top_k: 5    # top-k nodes re-scored on full train before final pick
    # snapshot_tree: true  # write snapshots/tree_snapshots.jsonl (best-at-budget
    #                      # time series for analysis; see snapshot_eval.py)
    seed: 42

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 1800
    memory_mb: 2048
    parallelism: 16
    scorer: "travel_default"

gatherer:
  type: "default"
  config:
    # Reuse the project error categorizer to drive the example-driven failure
    # report (top failure categories + representative query/plan/what-failed).
    # Omit to fall back to hardest-cases-only (still generic).
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"

editor:
  type: "default"
  config:
    model: "gpt-5.4-mini"
    reasoning_effort: "high"
    max_attempts: 2

# Train/eval split: the HGM budget is spent only on the train half; the
# eval half is run once, on the chosen best node, as a sidecar metric.
split:
  seed: 42
  train_size: 60

validators:
  - type: "syntax"
  - type: "signature"
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
