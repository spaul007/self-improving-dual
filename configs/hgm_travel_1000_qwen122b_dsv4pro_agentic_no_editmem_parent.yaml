experiment_name: "hgm_travel_1000_qwen122b_dsv4pro_agentic_no_editmem_parent"

# FULL RUN, NO-MEMORY CONTROL (2026-09-16): plain HGM + agentic editor, no
# edit-memory layer, eval_budget 1000, expansion-paired evaluation
# (expand_eval_size 16), 60-case train split. read_scope "parent": the editor
# sees only its parent node (code, logs, feedback) and its own workspace —
# never the rest of the run. As always the benchmark's scorer/cases and the
# database are neither bound into the sandbox nor readable by the editor tool.
#   task agent            : Qwen/Qwen3.5-122B-A10B at reasoning medium on the
#                           local node-5 vLLM (same as the smoke run)
#   editor                : DeepSeek V4 Pro (dated pin deepseek-v4-pro-0813 on
#                           OpenRouter, OpenRouter_API_KEY via api_key_env,
#                           provider pinned to Baidu)
#   scorer conversion     : node-5 Qwen (TRAVEL_CONVERT_*)
# Identical to hgm_travel_1000_qwen122b_dsv4pro_agentic_editmem.yaml except:
# no edit_memory block, read_scope "parent", experiment_name.
# Launch:
#   source /groups/AIC-MV/sudipta.paul/code/random/api.sh
#   PYTHONPATH=. python3 main_loop.py --config configs/hgm_travel_1000_qwen122b_dsv4pro_agentic_no_editmem_parent.yaml
project: "travel"

eval_visibility: "blackbox"   # ignored by the agentic editor: scorer never exposed
verbose: true                 # META_AGENT_VERBOSE=1: full prompts + message history per session

loop:
  max_rounds: 1000
  score_target: 0.99

task_agent:
  model: "Qwen/Qwen3.5-122B-A10B"
  reasoning_effort: "medium"
  base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

manager:
  type: "hgm"
  config:
    eval_budget: 1000
    init_expansions: 3
    alpha: 0.5
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 16
    # Expansion-paired evaluation (agentic setups, per user request
    # 2026-09-13): every freshly expanded child is evaluated on 16 random
    # train cases immediately (charged to the budget and to the widening
    # counter), so no editor session goes unmeasured. 0 restores the reference's decoupled behaviour. At
    # 1000 evals this keeps 32 nodes / 63 batches but makes 32 of the
    # batches mandatory child evaluations (31 bandit-chosen instead of 63).
    expand_eval_size: 16
    max_consecutive_edit_failures: 5   # abort when the editor is dead (2026-09-16: 495 failed rounds on an exhausted key)
    finalize_top_k: 3        # top-3 finalists topped up to the full 60-case train split before the final pick
    # Fresh 60-case seed pre-eval on the Qwen task agent (no seed_round_dir).
    full_eval_top_k: 0
    snapshot_tree: true
    seed: 42

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 1800
    memory_mb: 2048
    parallelism: 16
    scorer: "travel_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"

# Agentic editor on DeepSeek V4 Pro. reasoning "low" (medium drifts in long
# tool loops); llm_timeout_s caps one request so a stall cannot eat the
# session. The prompt is paths + budget only (include_manager_context false):
# the agent reads the parent's evidence from disk itself.
editor:
  type: "agentic"
  config:
    model: "deepseek/deepseek-v4-pro-0813"
    reasoning_effort: "low"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OpenRouter_API_KEY"
    # Pinned to one upstream provider (Baidu, fp8 — the cheapest deepseek-v4-pro-0813
    # endpoint on OpenRouter, 2026-09-16) so every call in the run is served by the
    # same weights/quantisation; no silent fallback to another provider.
    extra_body:
      provider:
        order: ["Baidu"]
        allow_fallbacks: false
    llm_timeout_s: 600
    max_attempts: 3
    max_llm_calls: 150
    timeout_s: 5400
    bash_timeout_s: 120
    max_tool_output_chars: 20000
    max_view_chars: 40000
    sandbox: "auto"
    include_manager_context: false
    # How much of the run the meta-agent may read (bash + editor tool):
    #   "run"    — every node of the run (the setting of the finished runs)
    #   "parent" — only $PARENT_DIR and its own $NODE_DIR; no $RUN_DIR root
    read_scope: "parent"

env:
  # No run-wide LLM_API_KEY_ENV: the task agent is on the local node-5 vLLM;
  # the editor and the edit-memory layer name api_key_env themselves.
  LLM_TIMEOUT_S: "1200"                   # task-agent per-request cap (< wall_time_s_per_case)
  META_AGENT_STRIP_REASONING: "1"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-122B-A10B"
  TRAVEL_CONVERT_BASE_URL: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
  # Fallback if node-5 is down — conversion on OpenRouter instead (adds
  # conversion tokens to the OpenRouter bill):
  # TRAVEL_CONVERT_MODEL: "qwen/qwen3.5-122b-a10b"
  # TRAVEL_CONVERT_BASE_URL: "https://openrouter.ai/api/v1"

split:
  train_ids_path: "configs/travel_train_ids.json"   # the 60 predetermined cases

validators:
  - type: "syntax"
  - type: "signature"
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
