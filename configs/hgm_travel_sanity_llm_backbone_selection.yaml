# Sanity run: same manager shape as
# hgm_travel_full_scale_block_tagged_no_summarizer_X100Y180.yaml (HGM,
# NO curriculum, block_selection_strategy: "adaptive", local vLLM
# pipeline default) but sanity-scale sizing, run specifically to confirm
# the new "llm_backbone_selection" block (see
# meta_agent/block_suggester.py's _BLOCK_BODIES) behaves correctly inside
# a REAL orchestrated HGM loop -- not just the isolated editor.apply()
# calls used to validate it in isolation. No config changes were needed
# to make this block reachable: it's a normal _BLOCK_BODIES entry, so
# "adaptive" already Thompson-samples it alongside the other five blocks
# with no special-casing.
#
# Sanity-only sizing (same X/Y convention as
# hgm_travel_deepseek_editor_sanity_1case.yaml): X=30 target good-enough
# agents, Y=20 evals each -> eval_budget=600, alpha=ln(30)/ln(600)=0.532.
# max_rounds=60 comfortably exceeds eval_budget**alpha (~30) and
# 1+init_expansions.
#
# IMPORTANT -- this run's task_agent/editor/etc. all default to the local
# vLLM cluster, but "llm_backbone_selection" always assigns an OpenRouter
# model when it fires (never a local endpoint -- see the block's own
# prose). OPENAI_API_KEY MUST be set to a real OpenRouter key before
# launch (source /groups/AIC-MV/v.kulkarni1/.env) -- this is safe even for
# the local vLLM calls, which ignore auth entirely and accept any
# non-empty string. Without a real key, any round that picks this block
# and actually gets a working proposal will fail smoke_test with
# `openai.AuthenticationError: 401` (confirmed live this session).
#
#   source /groups/AIC-MV/v.kulkarni1/.env
#   PYTHONPATH=. python3 main_loop.py --config configs/hgm_travel_sanity_llm_backbone_selection.yaml

experiment_name: "travel_mas_refactored_sanity_llm_backbone_selection"
project: "travel_mas_refactored"

mutable_exclude:
  - "workflow.py"
  - "benchmark/"
  - "agents/immutable/"
  # mas_llm_backbone.yaml is deliberately NOT excluded here -- the
  # llm_backbone_selection block's whole mechanism depends on the generic
  # editor being allowed to write it (see block_suggester.py's prose and
  # the plan file's design notes).

loop:
  max_rounds: 60
  score_target: 1.0

task_agent:
  model: "Qwen/Qwen3.5-35B-A3B"
  temperature: 0.2
  max_output_tokens: 16384
  base_url: "http://gpu-aic-mv-02-st-p5-node-6:8000/v1"

manager:
  type: "hgm_block_tagged"
  config:
    eval_budget: 600
    init_expansions: 2
    alpha: 0.532
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 8
    eval_repeats: 2  # >1 = repeats enabled (on/off switch, not a cap)
    finalize_top_k: 3
    full_eval_top_k: 0
    seed: 42
    block_selection_strategy: "adaptive"
    # Curriculum stays OFF (curriculum_enabled defaults to False) -- no
    # curriculum_* keys, matching the "(no curriculum)" request.

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 3600
    memory_mb: 2048
    parallelism: 8
    scorer: "travel_mas_refactored_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"
    n_hard_cases: 1

editor:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
    max_attempts: 2

failure_summarizer:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

block_suggester:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
    strategies_path: "strategies.md"

env:
  META_AGENT_STRIP_REASONING: "1"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-35B-A3B"

split:
  seed: 42
  train_size: 20
  eval_size: 0
  stratify_by: "meta_info.days"

validators:
  - type: "syntax"
  - type: "signature"
    config:
      workflow_filenames: ["workflow.py", "mas_workflow.py"]
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
  - type: "undefined_names"
  - type: "llm_backbone_config"
  - type: "smoke_test"
