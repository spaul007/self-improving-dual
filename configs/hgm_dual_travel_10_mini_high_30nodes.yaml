experiment_name: "travel_hgm_dual_10samples_mini_high_30nodes"

# Sibling of hgm_dual_travel_10_medium_30nodes.yaml. Same 30-node hgm_dual
# setup on the 10-sample travel train split; the only delta is the
# meta-agent model profile — editor and summarizer use gpt-5.4-mini at
# reasoning_effort=high (matches hgm_dual_travel_10.yaml). Task agent stays
# on gpt-5.4-mini.
project: "travel"

loop:
  max_rounds: 30
  score_target: 0.95

task_agent:
  model: "gpt-5.4-mini"
  reasoning_effort: "high"

manager:
  type: "hgm_dual"
  config:
    eval_budget: 1500
    init_expansions: 3
    alpha: 0.5
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 10
    finalize_top_k: 3
    full_eval_top_k: 3
    seed: 42

    num_variants: 2
    intra_expand_eval_size: 10
    variant_parallelism: 2
    select_metric: "mean"
    categorizer_max_representative_errors: 5
    min_remaining_budget_for_dual: 10
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 1800
    memory_mb: 2048
    parallelism: 10
    scorer: "travel_default"

gatherer:
  type: "default"
  config: {}

editor:
  type: "default"
  config:
    model: "gpt-5.4-mini"
    reasoning_effort: "high"
    max_attempts: 2

summarizer:
  type: "default"
  config:
    model: "gpt-5.4-mini"
    reasoning_effort: "high"

split:
  seed: 42
  train_size: 10

validators:
  - type: "syntax"
  - type: "signature"
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
