# Full 120-case evaluation of the travel seed agent against the local
# vLLM server hosting Qwen/Qwen3.5-122B-A10B on gpu-aic-mv-02 node-5,
# port 8000 (same server the travel HGM runs use). Run with evaluate.py:
#
#   PYTHONPATH=. python3 evaluate.py \
#       --config configs/eval_travel_qwen122b_node5_low.yaml \
#       --agent projects/travel/seed
#
# Delta vs the HGM run configs (e.g.
# configs/hgm_travel_1000_qwen122b_node5_editmem.yaml): the task agent
# runs at reasoning_effort "low" instead of "high", and this is a
# single-round standalone eval over all 120 benchmark cases (no
# train/eval split, no editing loop). Everything else — server, model,
# scorer routing, env — matches those runs so scores are comparable.
#
# Caveat: the node-5 vLLM server accepts reasoning.effort at all levels,
# but whether it actually changes the model's reasoning depends on how
# vLLM was launched (--reasoning-parser); see the note in
# configs/hgm_dual_travel_1000_qwen122b_node6.yaml. Compare reasoning
# token counts against a high-effort run to confirm the setting took.
# Side effect (platform_core/llm_wrapper.py): with effort set, the task
# agent's temperature comes from task_agent.temperature (default 0.2,
# exported per case subprocess as LLM_TEMPERATURE); set
# `temperature: null` under task_agent: for the old omit-temperature
# behavior that matched the pre-2026-08-28 HGM runs.

experiment_name: "eval_travel_qwen122b_node5_low"
project: "travel"
# runs_root omitted -> repo-local ./runs

loop:
  max_rounds: 1
  score_target: 1.0

task_agent:
  model: "Qwen/Qwen3.5-122B-A10B"
  reasoning_effort: "low"
  base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

manager:
  type: "hill_climbing"
  config:
    branch_policy: "best"
    strategy_history_window: 5

evaluator:
  type: "subprocess"
  config:
    # Same per-case budget and concurrency as the qwen122b node-5 HGM
    # runs (they evaluate 16-case batches against this server without
    # saturating it). max_cases unset -> all 120 benchmark cases.
    wall_time_s_per_case: 1800
    memory_mb: 2048
    parallelism: 16
    scorer: "travel_default"

gatherer:
  type: "default"
  config: {}

editor:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    max_attempts: 2

# Local models (Qwen3.x, gpt-oss) misread echoed `reasoning` items in the
# conversation history as a "wrap up" signal — they exit the tool loop
# without writing the formal <plan> block. Strip them before the next call.
# TRAVEL_CONVERT_MODEL routes the scorer's plan->JSON conversion at the
# same 122B model/endpoint (its base_url comes from task_agent.base_url ->
# LLM_BASE_URL, see meta_agent/runtime_env.py). Per-case travel CSV
# databases resolve to projects/travel/data/database_en by default, so no
# TRAVEL_DATABASE_ROOT override is needed.
env:
  META_AGENT_STRIP_REASONING: "1"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-122B-A10B"
  # Each case subprocess runs under RLIMIT_AS = memory_mb (2 GB). The openai
  # SDK import chain pulls numpy -> OpenBLAS, whose per-core thread buffers
  # on a many-core node alone exceed that limit ("OpenBLAS error: Memory
  # allocation still failed", child exit 1, 0/120). One BLAS thread avoids
  # the allocation; the agent does no BLAS math.
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

split:
  seed: 42
  train_size: 60

validators:
  - type: "syntax"
  - type: "signature"
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
