# Same base as hgm_travel_full_scale_block_tagged_no_summarizer_X100Y180.yaml
# (identical sizing/endpoints/validators/env/split), with two changes
# requested 2026-09-05:
#
#   1. manager.type: "hgm_block_tagged" -> "hgm_dual" (meta_agent/managers/
#      hgm_dual.py's HGMDualManager) -- Stage A/Stage B dual-EXPAND variant
#      trials instead of single-EXPAND. HGMDualManager extends HGMManager
#      (**base_kwargs forwards eval_budget/alpha/epsilon/beta_prior/
#      clade_pseudo_count/eval_batch_size/eval_repeats/finalize_top_k/
#      full_eval_top_k/seed/block_selection_strategy unchanged), plus a
#      required `error_categorizer` and several dual-specific knobs below,
#      carried over from the proven reference config
#      (configs/hgm_dual_travel_mas_35b_4000.yaml) rather than left at
#      HGMDualManager's own defaults, EXCEPT intra_expand_eval_size and
#      min_remaining_budget_for_dual, which are scaled 16->32 to match
#      this config's eval_batch_size=32 (the reference used
#      eval_batch_size=16) -- a judgment call, adjust if undesired.
#   2. behavior summarizer RE-ENABLED (the `summarizer:` section, omitted
#      in the no_summarizer sibling config, is back) -- alongside
#      error_categorizer (gatherer.config, unchanged) and failure_summarizer
#      (unchanged), so all three are on for this run, per the request.
#
# curriculum stays OFF (no curriculum_* keys), matching the sibling config
# and the explicit 2026-09-04 decision to turn it off for this experiment
# family.
#
# NOT launched yet -- prepared per request, wait for explicit go-ahead
# before running.
#
#   PYTHONPATH=. python3 main_loop.py --config configs/hgm_travel_full_scale_dual_X100Y180.yaml
#
# Double-check the task_agent/editor vLLM endpoints below against whatever's
# actually live before running -- this is a long, expensive run.

experiment_name: "travel_mas_refactored_full_scale_dual_X100Y180"
project: "travel_mas_refactored"

mutable_exclude:
  - "workflow.py"
  - "benchmark/"
  - "agents/immutable/"

loop:
  max_rounds: 130
  score_target: 1.0

task_agent:
  model: "Qwen/Qwen3.5-35B-A3B"
  temperature: 0.2
  max_output_tokens: 16384
  base_url: "http://gpu-aic-mv-02-st-p5-node-6:8000/v1"

manager:
  type: "hgm_dual"
  config:
    eval_budget: 18000
    init_expansions: 2
    alpha: 0.470005
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 32
    eval_repeats: 2  # >1 = repeats enabled (on/off switch, not a cap)
    finalize_top_k: 5
    full_eval_top_k: 0
    seed: 42
    block_selection_strategy: "adaptive"

    # --- hgm_dual-specific (values carried over from the proven reference
    # config configs/hgm_dual_travel_mas_35b_4000.yaml, except the two
    # scaled to this config's larger eval_batch_size -- see header note) ---
    num_variants: 2
    intra_expand_eval_size: 32   # reference used 16, scaled to match eval_batch_size=32
    variant_parallelism: 2
    select_metric: "mean"
    categorizer_max_representative_errors: 5
    min_remaining_budget_for_dual: 32  # reference used 16, scaled likewise
    category_selection: "balanced_by_type"
    category_types: ["commonsense", "hard_constraint"]
    snapshot_tree: true
    # Required by HGMDualManager itself (category-balanced variant
    # selection) -- distinct from gatherer.config.error_categorizer below
    # (which feeds the failure-digest text), same underlying function.
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 3600
    memory_mb: 2048
    parallelism: 32
    scorer: "travel_mas_refactored_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"
    n_hard_cases: 1

editor:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
    max_attempts: 2

# behavior summarizer -- RE-ENABLED for this run (2026-09-05), unlike the
# no_summarizer sibling config.
summarizer:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

failure_summarizer:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

block_suggester:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
    strategies_path: "strategies.md"

env:
  META_AGENT_STRIP_REASONING: "1"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-35B-A3B"

split:
  seed: 42
  train_size: 60
  eval_size: 60
  stratify_by: "meta_info.days"

validators:
  - type: "syntax"
  - type: "signature"
    config:
      workflow_filenames: ["workflow.py", "mas_workflow.py"]
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
  - type: "undefined_names"
  - type: "smoke_test"
