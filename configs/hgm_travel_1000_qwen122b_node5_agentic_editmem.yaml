experiment_name: "travel_hgm_1000_qwen122b_node5_agentic_editmem"

# Agentic-editor arm. Identical to configs/hgm_travel_1000_qwen122b_node5_editmem.yaml
# (same 60-case predetermined train set, same budget, same seed, same bandit
# hyper-params, same edit_memory block) except for the `editor:` block — type
# "agentic", meta-model DeepSeek V4 Pro on OpenRouter:
# the meta-agent runs an HGM-seed-style tool loop (bash in a bubblewrap
# sandbox + a str_replace editor + validate) on the round's task_agent copy
# and reads the parent's evidence and the run's edit memory / diffs / beliefs
# / category registry from disk itself, instead of one single-shot call fed a
# feedback digest + steering context.
#
#   control   : hgm_travel_1000_qwen122b_node5_editmem.yaml  (editor.type: default)
#   treatment : this file                                    (editor.type: agentic)
#
# Per expansion: up to max_llm_calls tool-loop iterations (history re-sent each
# call) instead of one call — budget for that. Requires bubblewrap on the
# compute node (sandbox: auto falls back to cwd-only with a printed warning;
# set sandbox: "bwrap" to refuse running unconfined).
project: "travel"

eval_visibility: "blackbox"   # ignored by the agentic editor: scorer never exposed

loop:
  max_rounds: 1000
  score_target: 0.99

task_agent:
  model: "Qwen/Qwen3.5-122B-A10B"
  reasoning_effort: "high"
  base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

manager:
  type: "hgm"
  config:
    eval_budget: 1000
    init_expansions: 3
    alpha: 0.5
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 16
    # Expansion-paired evaluation (agentic setups, per user request
    # 2026-09-13): every freshly expanded child is evaluated on 16 random
    # train cases immediately (charged to the budget and to the widening
    # counter), so no editor session goes unmeasured and the belief judge
    # sees every node. 0 restores the reference's decoupled behaviour. At
    # 1000 evals this keeps 32 nodes / 63 batches but makes 32 of the
    # batches mandatory child evaluations (31 bandit-chosen instead of 63).
    expand_eval_size: 16
    finalize_top_k: 3
    snapshot_tree: true
    seed: 42

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 1800
    memory_mb: 2048
    parallelism: 16
    scorer: "travel_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"

# META-MODEL: DeepSeek V4 Pro on OpenRouter (dated pin deepseek-v4-pro-0813,
# $0.66/M in, $1.98/M out). Only the agentic editor goes to OpenRouter — the
# task agent and edit memory stay on local node-5 Qwen exactly as in the
# control arm — so the arms differ in the editor only. api_key_env reads the
# OpenRouter key from its own env var:
#   source /groups/AIC-MV/sudipta.paul/code/random/api.sh
#   PYTHONPATH=. python3 main_loop.py --config configs/hgm_travel_1000_qwen122b_node5_agentic_editmem.yaml
# reasoning_effort "low": at "medium" this model's per-turn reasoning drifted to
# 33k tokens / 444 s in long tool loops (eval_travel_or_dsv4pro_0813_noreason.yaml)
# and an editing session is a 40-turn tool loop. llm_timeout_s caps a single
# request so one stall cannot consume the session. Cost: history is re-sent
# every call — the Qwen dry run used ~530k input tokens over 26 calls (≈$0.4);
# expect roughly $0.5-1 per expansion at 40 calls.
editor:
  type: "agentic"
  config:
    model: "deepseek/deepseek-v4-pro-0813"
    reasoning_effort: "low"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OpenRouter_API_KEY"
    llm_timeout_s: 600
    max_attempts: 3          # submission / validation rounds
    max_llm_calls: 40        # tool-loop iterations per expansion
    timeout_s: 2400          # wall-clock per session; stops at 90%
    bash_timeout_s: 120
    max_tool_output_chars: 20000
    max_view_chars: 40000
    sandbox: "auto"
    include_manager_context: false

# summarizer: INTENTIONALLY ABSENT — behavioral summary stays off.

# Per-node edit memory, unchanged from the control arm. The agentic editor
# does not receive the rendered steering block; it reads round_NNN/edit_memory.md,
# edit_code.md and the run-level registry / belief files directly.
edit_memory:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
    steering: true
    steering_token_budget: 48000
    verdict_threshold: 0.02
    min_shared: 8
    max_strategies: 18
    max_subedits: 3
    diff_char_cap: 6000
    setup_pass: true
    per_check_recipe: null

env:
  META_AGENT_STRIP_REASONING: "1"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-122B-A10B"
  TRAVEL_CONVERT_BASE_URL: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

split:
  train_ids_path: "configs/travel_train_ids.json"   # 60 predetermined cases

validators:
  - type: "syntax"
  - type: "signature"
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
