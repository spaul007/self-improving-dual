# EVAL-ONLY config: task agent + scorer conversion on the LOCAL vLLM
# node-5 serving of Qwen/Qwen3.5-122B-A10B at reasoning_effort MEDIUM
# (unchanged from the runs under evaluation). For snapshot_eval.py over
# the 20260827 OpenRouter A/B pair after the key limit 403'd their
# original evals. editor block unused by snapshot_eval.
experiment_name: "travel_hgm_1000_or_medium_no_editmem"

# CONTROL arm of the medium-effort A/B pair (vs ..._medium_editmem —
# identical except the ABSENT edit_memory block). Task agent AND meta agent
# at reasoning_effort medium (measured: ~21% cheaper than high at score
# parity). First pair on the round-3 edit memory (RECORD_FORMAT 5: rigorous
# causes, scorer cross-tab + SUSPECT flags, seen-vs-unseen generalization,
# three-move steering policy).
# All-OpenRouter arm with the reworked edit memory — the "edit_memory_v4"
# preview format as approved (evidence-only analysis, likely-cause, signed
# improvement-positive convention) plus the post-preview refinements
# (sidecar machine state, interpretation header). Internally this is
# RECORD_FORMAT 3 / ANALYSIS_VERSION 2 — those constants count record
# layouts and analysis question-sets, not the preview folder numbers.
#
# Split of labour — every LLM site goes through OpenRouter:
#   task agent + conversion -> Qwen/Qwen3.5-122B-A10B   (same weights/ctx as
#                              the local vLLM node-5 serving; 262144 ctx)
#   meta agent (editor)     -> Qwen/Qwen3.5-122B-A10B (reasoning medium)
#   edit memory (tagger+analysis) -> Qwen/Qwen3.5-122B-A10B (reasoning medium)
#
# Task-agent reasoning_effort mirrors
# runs/20260825_191551_travel_hgm_1000_dsv4flash_no_editmem: "high".
#
# AUTH: platform_core/llm_wrapper.py reads ONE global OPENAI_API_KEY for every
# LLM site. Export the OpenRouter key as OPENAI_API_KEY before launching.
project: "travel"

eval_visibility: "blackbox"

loop:
  max_rounds: 1000
  score_target: 0.99

task_agent:
  model: "Qwen/Qwen3.5-122B-A10B"
  reasoning_effort: "medium"
  base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

manager:
  type: "hgm"
  config:
    eval_budget: 1000
    init_expansions: 3
    alpha: 0.5
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 16
    finalize_top_k: 3
    snapshot_tree: true
    seed: 42

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 1800
    memory_mb: 2048
    parallelism: 16
    scorer: "travel_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"

editor:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    max_attempts: 2
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

# summarizer: INTENTIONALLY ABSENT — behavioral summary stays off.

# edit_memory: INTENTIONALLY ABSENT — this is the control arm.

env:
  META_AGENT_STRIP_REASONING: "1"
  # Conversion is part of evaluation; keep it on the same Qwen — via
  # OpenRouter, so this run has no dependency on the local vLLM nodes.
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-122B-A10B"
  TRAVEL_CONVERT_BASE_URL: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

split:
  train_ids_path: "configs/travel_train_ids.json"   # 60 predetermined cases

validators:
  - type: "syntax"
  - type: "signature"
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
