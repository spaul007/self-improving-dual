# Stage-1 sanity check for block-suggestion + hardcoded block selection
# (tier_based_hgm.md's first roadmap slice) against travel_mas_refactored,
# using the vanilla `hgm` manager (not hgm_dual -- this project has no
# existing hgm-manager config; configs/travel_mas_refactored_qwen35b_implicit.yaml
# uses hill_climbing, and configs/hgm_dual_travel_mas_35b_sanity.yaml targets
# the older unrefactored `travel_mas` project). Small eval_budget, meant to
# exercise the full round loop end to end (block selected -> block suggester
# called -> suggestion appears in the editor's steering context -> strategy.json
# carries a non-null "block" field) -- not a real optimization run. Modeled
# structurally on configs/hgm_math_mas_sanity.yaml; task_agent/editor/env
# settings copied from configs/travel_mas_refactored_qwen35b_implicit.yaml.
#
#   PYTHONPATH=. python3 main_loop.py --config configs/hgm_travel_mas_refactored_block_sanity.yaml
#
# Double-check the task_agent/editor vLLM endpoints below against whatever's
# actually live before running -- copied from the last-known-good travel
# config as placeholders, not re-verified here.

experiment_name: "travel_mas_refactored_hgm_block_sanity"
project: "travel_mas_refactored"

mutable_exclude:
  - "workflow.py"
  - "benchmark/"
  - "agents/immutable/"

loop:
  # max_rounds also directly caps tree size (hgm.py checks
  # n_real_nodes() < max_rounds in the main loop, not just eval_budget) --
  # the first sanity run's max_rounds=3 was the actual binding constraint
  # that limited it to 2 EXPANDs, not eval_budget=6. Bumped to 10 so the
  # eval_budget=20 bump (see manager.config) can actually produce more
  # EXPAND samples for the compliance-fraction check.
  max_rounds: 10
  score_target: 1.0

task_agent:
  model: "Qwen/Qwen3.5-35B-A3B"
  # implicit mode -- reasoning_effort intentionally omitted, see
  # qwen35bnotworking.md / configs/travel_mas_refactored_qwen35b_implicit.yaml.
  temperature: 0.2
  max_output_tokens: 16384
  base_url: "http://gpu-aic-mv-02-st-p5-node-6:8000/v1"

manager:
  type: "hgm"
  config:
    # Bumped 6 -> 20 for the second sanity pass: the first run (eval_budget=6)
    # only produced 2 EXPANDs, too small a sample to compute a meaningful
    # collaboration_workflow-prompt-compliance fraction. ~20 gives roughly
    # 5-8 EXPANDs at alpha=0.6 (budget_spent^alpha ~ 6-7 by budget=20).
    eval_budget: 20
    init_expansions: 1
    alpha: 0.6
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 2
    finalize_top_k: 1
    full_eval_top_k: 0
    seed: 42

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 3600
    memory_mb: 2048
    parallelism: 3
    scorer: "travel_mas_refactored_default"

gatherer:
  type: "default"
  config:
    # Groups per-case failures by category (e.g. reasonable_transfer_time,
    # traceable_accommodation) with representative examples, instead of
    # degrading to 3 arbitrary hardest-cases -- reused verbatim from
    # projects/travel (pure schema-logic over dimension_details/
    # hard_constraints/failed_checks, which travel_mas_refactored's own
    # scorer emits identically; confirmed live 2026-09-01).
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"
    # Supplementary "hardest cases not already covered by a category"
    # top-off shown alongside the categorized examples above -- default
    # is 3; trimmed to 1 (2026-09-01) so the editor sees one extra worst
    # case rather than padding out the context with near-duplicates of
    # what the categorizer already surfaced.
    n_hard_cases: 1

editor:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
    max_attempts: 2

summarizer:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

# LLM-synthesized cross-case failure summary -- also feeds the block
# suggester's feedback digest (see block_suggester.py::suggest's
# failure_summary arg, threaded through hgm.py's shared `failure_summary`
# local computed once in _render_expand_context).
failure_summarizer:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

# NEW: block-scoped suggestion, one call per EXPAND. Same meta-agent
# model/endpoint as editor/failure_summarizer for consistency.
block_suggester:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
    # Curated, human-editable "good strategies" reference (general
    # + per-block) spliced into the suggestion prompt right after
    # the block definition -- see strategies.md's own header.
    strategies_path: "strategies.md"

env:
  META_AGENT_STRIP_REASONING: "1"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-35B-A3B"

# Small, cheap train pool sized to eval_budget; disable the held-out pass
# (this is a plumbing sanity check, not an optimization run).
split:
  seed: 42
  train_size: 6
  eval_size: 0

validators:
  - type: "syntax"
  # workflow.py is a trivial, permanently-excluded delegator to
  # mas_workflow.py's real run_task -- check both so a broken
  # mas_workflow.py::run_task signature is caught pre-evaluation (as a
  # retryable validator error) instead of crashing every eval case
  # identically at real-evaluation time. See editor_validators.py's
  # SignatureValidator docstring.
  - type: "signature"
    config:
      workflow_filenames: ["workflow.py", "mas_workflow.py"]
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
