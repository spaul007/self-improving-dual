# Sanity-check config for the new "adaptive" block_selection_strategy
# (Thompson sampling over a per-block BlockBandit, see
# meta_agent/block_bandit.py and tier_based_hgm.md's "Block-level Thompson
# sampling" section). Cloned from configs/hgm_block_strategy_non_adaptive.yaml
# (same project/models/endpoints/train pool) but with a MUCH smaller
# eval_budget/max_rounds -- this is a quick verification run, not part of
# the 5-strategy comparison batch (that batch's driver script and its
# currently-running non_adaptive process are untouched by this file).
#
# max_rounds=10 clears both of HGMManager.evolve()'s asserts for these
# settings: max_rounds > eval_budget**alpha (40**0.6 ~= 9.3) and
# max_rounds > 1+init_expansions (3).
#
#   PYTHONPATH=. python3 main_loop.py --config configs/hgm_block_strategy_adaptive.yaml
#
# Double-check the task_agent/editor vLLM endpoints below against whatever's
# actually live before running.

experiment_name: "travel_mas_refactored_block_strategy_adaptive_sanity"
project: "travel_mas_refactored"

mutable_exclude:
  - "workflow.py"
  - "benchmark/"
  - "agents/immutable/"

loop:
  max_rounds: 10
  score_target: 1.0

task_agent:
  model: "Qwen/Qwen3.5-35B-A3B"
  temperature: 0.2
  max_output_tokens: 16384
  base_url: "http://gpu-aic-mv-02-st-p5-node-6:8000/v1"

manager:
  type: "hgm"
  config:
    eval_budget: 40
    init_expansions: 2
    alpha: 0.6
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 4
    finalize_top_k: 3
    full_eval_top_k: 0
    seed: 42
    block_selection_strategy: "adaptive"

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 3600
    memory_mb: 2048
    parallelism: 3
    scorer: "travel_mas_refactored_default"

gatherer:
  type: "default"
  config: {}

editor:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
    max_attempts: 2

failure_summarizer:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

block_suggester:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

env:
  META_AGENT_STRIP_REASONING: "1"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-35B-A3B"

split:
  seed: 42
  train_ids_path: "configs/travel_mas_refactored_representative_20_ids.json"

validators:
  - type: "syntax"
  - type: "signature"
    config:
      workflow_filenames: ["workflow.py", "mas_workflow.py"]
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
