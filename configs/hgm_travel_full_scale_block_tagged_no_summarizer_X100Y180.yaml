# Production sanity run: same sizing/manager as
# hgm_travel_full_scale_block_tagged_X100Y180.yaml (eval_budget=18000,
# adaptive block selection + repeat-eligible dripping, full 120-case
# benchmark, 60 train / 60 held-out validation, stratified by trip length,
# seed=42), with ONE deliberate difference requested 2026-09-04:
#
#   behavior summarizer DISABLED (the `summarizer:` component/section is
#   omitted entirely -- meta_agent/config.py's cfg.summarizer stays None,
#   so HGMManager never builds or calls a BehaviorSummarizer).
#   error_categorizer (under gatherer) and failure_summarizer are BOTH
#   kept exactly as in the production config -- only the behavior
#   summarizer is turned off.
#
# Curriculum was considered for this run and then explicitly turned back
# off (2026-09-04) -- curriculum_enabled defaults to False, so no
# curriculum_* keys appear under manager.config at all.
#
# All models/endpoints are the local vLLM cluster (task_agent, editor,
# failure_summarizer, block_suggester) -- no external/OpenRouter model
# for this run, unlike the small DeepSeek-editor sanity check.
#
#   PYTHONPATH=. python3 main_loop.py --config configs/hgm_travel_full_scale_block_tagged_no_summarizer_X100Y180.yaml
#
# Double-check the task_agent/editor vLLM endpoints below against whatever's
# actually live before running -- this is a long, expensive run.

experiment_name: "travel_mas_refactored_full_scale_block_tagged_no_summarizer_X100Y180"
project: "travel_mas_refactored"

mutable_exclude:
  - "workflow.py"
  - "benchmark/"
  - "agents/immutable/"

loop:
  max_rounds: 130
  score_target: 1.0

task_agent:
  model: "Qwen/Qwen3.5-35B-A3B"
  temperature: 0.2
  max_output_tokens: 16384
  base_url: "http://gpu-aic-mv-02-st-p5-node-6:8000/v1"

manager:
  type: "hgm_block_tagged"
  config:
    eval_budget: 18000
    init_expansions: 2
    alpha: 0.470005
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 32
    eval_repeats: 2  # >1 = repeats enabled (on/off switch, not a cap)
    finalize_top_k: 5
    full_eval_top_k: 0
    seed: 42
    block_selection_strategy: "adaptive"

    # Curriculum turned OFF for this run (2026-09-04 decision, reversing
    # the earlier plan to enable it) -- curriculum_enabled defaults to
    # False, so simply omitting every curriculum_* key here is sufficient;
    # left unset rather than writing curriculum_enabled: false so there's
    # no stale curriculum_check_descriptions_path/threshold sitting next
    # to a disabled feature.

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 3600
    memory_mb: 2048
    parallelism: 32
    scorer: "travel_mas_refactored_default"

gatherer:
  type: "default"
  config:
    # Groups per-case failures by category (e.g. reasonable_transfer_time,
    # traceable_accommodation) with representative examples, instead of
    # degrading to 3 arbitrary hardest-cases -- reused verbatim from
    # projects/travel (pure schema-logic over dimension_details/
    # hard_constraints/failed_checks, which travel_mas_refactored's own
    # scorer emits identically). KEPT for this run per the 2026-09-04 request.
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"
    n_hard_cases: 1

editor:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
    max_attempts: 2

# behavior summarizer (`summarizer:`) DELIBERATELY OMITTED for this run --
# meta_agent/config.py's cfg.summarizer stays None, so HGMManager never
# builds or calls a BehaviorSummarizer at all. This is the one component
# switched off per the 2026-09-04 request; error_categorizer (above) and
# failure_summarizer (below) are both kept on.

failure_summarizer:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

block_suggester:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
    strategies_path: "strategies.md"

env:
  META_AGENT_STRIP_REASONING: "1"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-35B-A3B"

split:
  seed: 42
  train_size: 60
  eval_size: 60
  stratify_by: "meta_info.days"

validators:
  - type: "syntax"
  - type: "signature"
    config:
      workflow_filenames: ["workflow.py", "mas_workflow.py"]
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
  - type: "undefined_names"
  - type: "llm_backbone_config"
  - type: "smoke_test"
