# EVAL-ONLY variant of the 20260825_224252 run config: task agent and
# scorer conversion moved to the LOCAL vLLM node-5 serving of the same
# Qwen3.5-122B weights. Used with snapshot_eval.py to re-evaluate the
# run's best agent under local serving; the editor block is unused by
# snapshot_eval.
experiment_name: "travel_hgm_1000_or_qwen122b_qwenmeta_editmem"

# Task-agent reasoning_effort mirrors
# runs/20260825_191551_travel_hgm_1000_dsv4flash_no_editmem: "high".
#
# AUTH: platform_core/llm_wrapper.py reads ONE global OPENAI_API_KEY for every
# LLM site. Export the OpenRouter key as OPENAI_API_KEY before launching.
project: "travel"

eval_visibility: "blackbox"

loop:
  max_rounds: 1000
  score_target: 0.99

task_agent:
  model: "Qwen/Qwen3.5-122B-A10B"
  reasoning_effort: "high"
  base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

# (manager/editor are required by the config schema but unused by evaluate.py / snapshot_eval.py)
manager:
  type: "hgm"
  config:
    eval_budget: 1000
    init_expansions: 3
    alpha: 0.5
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 16
    finalize_top_k: 3
    snapshot_tree: true
    seed: 42

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 1800
    memory_mb: 2048
    parallelism: 16
    scorer: "travel_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"

editor:
  type: "agentic"
  config:
    model: "qwen/qwen3.5-122b-a10b"
    reasoning_effort: "medium"
    base_url: "https://openrouter.ai/api/v1"
    max_attempts: 3

env:
  META_AGENT_STRIP_REASONING: "1"
  # Conversion is part of evaluation; keep it on the same Qwen — via
  # OpenRouter, so this run has no dependency on the local vLLM nodes.
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-122B-A10B"
  TRAVEL_CONVERT_BASE_URL: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

split:
  train_ids_path: "configs/travel_train_ids.json"   # 60 predetermined cases

validators:
  - type: "syntax"
  - type: "signature"
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
