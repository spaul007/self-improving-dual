experiment_name: "travel_hgm_dual_1000_qwen122b_node2"

# previous name was experiment_name: "travel_hgm_dual_4000_qwen122b_node6", so some info might be saved there

# 4000-budget HGM-dual run on the PREDETERMINED 60-case optimization set
# (configs/travel_train_ids.json), driven entirely by the local vLLM server
# on gpu-aic-mv-01-st-p5-node-6 hosting Qwen/Qwen3.5-122B-A10B. Structurally
# identical to configs/hgm_dual_travel_8000_balanced.yaml except:
#   - eval_budget: 8000 -> 4000
#   - every LLM call site (task agent, agent editor, summarizer, and the
#     scorer's plan->JSON conversion) uses Qwen/Qwen3.5-122B-A10B via base_url
#   - evaluator.parallelism reduced from 16 -> 8 so a single vLLM server
#     isn't overwhelmed (parallelism 8 crashed the smaller 35B server; the
#     122B 8xH100 server has more headroom — drop to 4 if you see
#     APIConnectionError retries in logs/trace.jsonl).
#
# reasoning_effort keeps the reference values (task=high, editor/summarizer
# =medium). The node-6 server accepts reasoning.effort at all levels
# (probed: medium/high/low all return 200 with output); whether it changes
# the model's behavior depends on how vLLM was launched (--reasoning-parser).
# Sending it is harmless either way.
project: "travel"

eval_visibility: "blackbox"

loop:
  max_rounds: 1000
  score_target: 0.99

task_agent:
  model: "Qwen/Qwen3.5-122B-A10B"
  reasoning_effort: "high"
  base_url: "http://gpu-aic-mv-02-st-p5-node-2:8000/v1"

manager:
  type: "hgm_dual"
  config:
    eval_budget: 1000
    init_expansions: 3
    alpha: 0.5
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 16
    finalize_top_k: 3
    seed: 42
    num_variants: 2
    intra_expand_eval_size: 16
    variant_parallelism: 2
    select_metric: "mean"
    categorizer_max_representative_errors: 5
    min_remaining_budget_for_dual: 16
    category_selection: "balanced_by_type"
    category_types: ["commonsense", "hard_constraint"]
    snapshot_tree: true
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 1800
    memory_mb: 2048
    parallelism: 16
    scorer: "travel_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"

editor:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    max_attempts: 2
    base_url: "http://gpu-aic-mv-02-st-p5-node-2:8000/v1"

summarizer:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-2:8000/v1"

# Local models (Qwen3.x, gpt-oss) misread echoed `reasoning` items in the
# conversation history as a "wrap up" signal and exit the tool loop without
# writing the formal <plan> block — strip them before the next call.
# TRAVEL_CONVERT_MODEL routes the scorer's plan->JSON conversion at the same
# Qwen model (its base_url comes from task_agent.base_url -> LLM_BASE_URL,
# which meta_agent/runtime_env.py exports into the parent/evaluator process).
env:
  META_AGENT_STRIP_REASONING: "1"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-122B-A10B"

split:
  train_ids_path: "configs/travel_train_ids.json"   # 60 predetermined cases; no held-out eval

validators:
  - type: "syntax"
  - type: "signature"
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
