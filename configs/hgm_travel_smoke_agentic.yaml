experiment_name: "travel_hgm_smoke60_agentic"

# End-to-end smoke for the AGENTIC editor (HGM-seed-style bash + editor tool
# loop, bubblewrap-sandboxed, no docker) on the REAL 60-case train split with a
# small budget (96 evals ≈ 6 batches, ≤8 rounds). No memory of any kind.
# Checks the artifacts, not the score:
#   * every expanded round_*/agentic/ has transcript.jsonl + session.json with
#     sandbox_mode == "bwrap", end_reason == "submitted", validation_rounds <= 3
#   * transcript shows reads of the parent's feedback.json / logs/case_*.json,
#     str_replace edits, a `validate` call, then submit_self_improvement
#   * with META_AGENT_VERBOSE=1, verbose/editor_agentic_instruction.txt lists
#     paths only (no inlined source, no feedback digest, no steering context)
#   * the parent console prints no "[editor:agentic] bwrap unavailable" line
# The task agent needs the node-5 vLLM endpoint; the editor needs the
# OpenRouter key (see the editor block). Run:
#   source /groups/AIC-MV/sudipta.paul/code/random/api.sh
#   PYTHONPATH=. python3 main_loop.py --config configs/hgm_travel_smoke_agentic.yaml
project: "travel"

eval_visibility: "blackbox"   # ignored by the agentic editor: scorer never exposed

loop:
  max_rounds: 8
  score_target: 0.99

task_agent:
  model: "Qwen/Qwen3.5-122B-A10B"
  reasoning_effort: "medium"
  base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

manager:
  type: "hgm"
  config:
    eval_budget: 96
    init_expansions: 2
    alpha: 0.5
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 16
    # Expansion-paired evaluation (agentic setups, per user request
    # 2026-09-13): every freshly expanded child is evaluated on 16 random
    # train cases immediately (charged to the budget and to the widening
    # counter), so no editor session goes unmeasured. 0 restores the reference's decoupled behaviour. At
    # 1000 evals this keeps 32 nodes / 63 batches but makes 32 of the
    # batches mandatory child evaluations (31 bandit-chosen instead of 63).
    expand_eval_size: 16
    finalize_top_k: 2
    snapshot_tree: false
    seed: 42

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 1800
    memory_mb: 2048
    parallelism: 16
    scorer: "travel_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"

# The agentic editor: one tool-use session per expansion. The model reads the
# parent node's evidence from disk itself; the manager's steering context and
# the feedback digest are NOT put in the prompt (include_manager_context: false).
# META-MODEL: DeepSeek V4 Pro on OpenRouter (dated pin deepseek-v4-pro-0813,
# $0.66/M in, $1.98/M out — the slug the 2026-09-10 travel evals used). Only
# the agentic editor goes to OpenRouter; the task agent stays on the local
# node-5 Qwen. api_key_env makes the editor read the OpenRouter
# key from its own env var, so the launch is just:
#   source /groups/AIC-MV/sudipta.paul/code/random/api.sh   # exports OpenRouter_API_KEY (+ OPENAI_API_KEY)
#   PYTHONPATH=. python3 main_loop.py --config configs/hgm_travel_smoke_agentic.yaml
# reasoning_effort "low": at "medium" this model's per-turn reasoning drifted to
# 33k tokens / 444 s in long tool loops (see eval_travel_or_dsv4pro_0813_noreason.yaml);
# a 25-40 turn editing session is exactly that shape. llm_timeout_s caps one
# request so a stalled OpenRouter call cannot eat the session budget.
# Cost: the Qwen dry run re-sent ~530k input tokens over 26 calls ⇒ ≈$0.4 per
# expansion at this budget.
editor:
  type: "agentic"
  config:
    model: "deepseek/deepseek-v4-pro-0813"
    reasoning_effort: "low"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OpenRouter_API_KEY"
    llm_timeout_s: 600
    max_attempts: 3          # submission / validation rounds
    max_llm_calls: 25        # tool-loop iterations (whole history re-sent each call)
    timeout_s: 1200          # wall-clock per session; stops at 90%
    bash_timeout_s: 120
    max_tool_output_chars: 20000
    max_view_chars: 40000
    sandbox: "auto"          # bwrap when usable, else cwd-only with a warning
    include_manager_context: false
    # How much of the run the meta-agent may read (bash + editor tool):
    #   "run"    — every node of the run
    #   "parent" — only $PARENT_DIR and its own $NODE_DIR; no $RUN_DIR root
    read_scope: "run"

env:
  META_AGENT_STRIP_REASONING: "1"
  META_AGENT_VERBOSE: "1"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-122B-A10B"
  TRAVEL_CONVERT_BASE_URL: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"

split:
  train_ids_path: "configs/travel_train_ids.json"   # the full 60-case set

validators:
  - type: "syntax"
  - type: "signature"
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
