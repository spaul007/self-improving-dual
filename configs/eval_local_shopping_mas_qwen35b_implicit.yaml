# Full-120-case BASELINE measurement of shopping_mas's unedited seed against
# the local vLLM server hosting Qwen/Qwen3.5-35B-A3B (node-6), implicit
# thinking mode (the vendor's own default -- see below). Sibling of
# configs/hgm_dual_shopping_mas_sanity.yaml (same registration/exclude
# wiring), just scaled for a real full-benchmark pass rather than a wiring
# check: evaluator.parallelism and MAS_SCOUT_WORKERS bumped up from the
# sanity config's deliberately-small 2/2.
#
#   PYTHONPATH=. python3 evaluate_task_agent.py \
#       --config configs/eval_local_shopping_mas_qwen35b_implicit.yaml \
#       --agent-dir projects/shopping_mas/shopping_mas \
#       --label baseline_full_35b_implicit
#
# "Implicit thinking": shopping_mas has no global reasoning-mode env var
# (unlike the single-agent shopping project's LLM_REASONING_EFFORT) -- the
# vendor hardcodes `thinking=True/False` per individual LLM call inside each
# agent's own workflow.py (e.g. Cart-Executor explicitly disables it for
# clean tool-calls; most other calls default to on). This is the vendor's
# own deliberate, already-tuned design, left untouched here -- confirmed
# working live this session (one smoke-tested case: case_score=1.0, 5/5
# products matched, 73 LLM calls, 739s).
#
# Concurrency: node-6 is a single 35B-class vLLM server that saturates fast
# under high concurrency (see eval_local_travel_qwen3_5_35b_node1.yaml's own
# note: parallelism=8 there produced ~140 APIConnectionError retries).
# Total concurrent requests here are roughly
# evaluator.parallelism x MAS_SCOUT_WORKERS (each case's own scout stage
# fans out internally) -- kept modest (4 x 3 = 12 peak) rather than pushing
# either knob high individually.

experiment_name: "shopping_mas_baseline_full_35b_implicit"

project: "shopping_mas"
seed_dir_name: "shopping_mas"

mutable_exclude:
  - "workflow.py"
  - "config.py"
  - "llm_client.py"
  - "tools/immutable/"
  - "eval/"

tool_source_dirs:
  - "tools/immutable"
  - "tools/mutable"

loop:
  max_rounds: 1
  score_target: 1.0

manager:
  type: "hill_climbing"
  config:
    branch_policy: "best"
    strategy_history_window: 5

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 1800
    # 2048 crashed every case immediately: "OpenBLAS error: Memory
    # allocation still failed after 10 retries, giving up." --
    # tools/immutable/search_products_tool.py imports rank_bm25 -> numpy,
    # and OpenBLAS reserves far more virtual address space than the
    # subprocess's actual usage under this evaluator's RLIMIT_AS cap
    # (meta_agent/evaluator.py::_preexec). Confirmed live: math_mas_pathology
    # and the single-agent shopping project (neither has a numpy dependency)
    # are both fine at lower caps; shopping_mas specifically needs headroom.
    memory_mb: 8192
    parallelism: 4
    scorer: "shopping_mas_default"

gatherer:
  type: "shopping_mas_default"
  config: {}

# Required by FrameworkConfig's schema even though evaluate_task_agent.py
# never invokes the editor (it doesn't call manager.evolve()).
editor:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "high"
    base_url: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
    max_attempts: 2

env:
  MAS_MODEL: "Qwen/Qwen3.5-35B-A3B"
  MAS_BASE_URL: "http://gpu-aic-mv-02-st-p5-node-6:8000/v1"
  MAS_API_KEY: "EMPTY"
  MAS_TEMPERATURE: "0.2"
  MAS_MAX_TOKENS: "16384"
  MAS_MAX_TOOL_ROUNDS: "12"
  MAS_MAX_LLM_CALLS: "240"
  MAS_TOP_K: "8"
  MAS_SCOUT_WORKERS: "3"    # per-case internal fan-out; MAS_WORKERS is irrelevant here --
                            # our workflow.py calls MASWorkflow.run_task directly (one case
                            # per subprocess), never run_many, so it never reads MAS_WORKERS
  SHOPPING_DATABASE_ROOT: "/groups/AIC-MV/v.kulkarni1/unified_framework/self-improving-dual/projects/shopping_mas/data"

split:
  seed: 42
  train_size: 120   # irrelevant to evaluate_task_agent.py (which evaluates the full
                     # benchmark by default with no --case-ids/--eval-split/--limit),
                     # kept only so this config validates against the same schema as
                     # the sanity config

validators:
  - type: "syntax"
  - type: "signature"
  - type: "immutable_files"
  - type: "load_test"
