# 10-case smoke evaluation of the travel baseline seed against the local
# vLLM server on gpu-aic-mv-01-st-p5-node-6 hosting Qwen/Qwen3.5-122B-A10B.
# Run directly with evaluate.py (no SLURM/discovery plumbing needed):
#
#   PYTHONPATH=. python3 evaluate.py \
#       --config configs/eval_local_qwen3_5_122b_node6.yaml \
#       --agent projects/travel/seed
#
# base_url is hard-wired below. The travel scorer's plan->JSON conversion is
# routed to the same server + model via TRAVEL_CONVERT_MODEL plus the
# LLM_BASE_URL that task_agent.base_url exports (meta_agent/runtime_env.py).
# The server ignores auth, so OPENAI_API_KEY=EMPTY is used automatically.

experiment_name: "eval_local_qwen3_5_122b_node6"
project: "travel"
# runs_root omitted -> repo-local ./runs

loop:
  max_rounds: 1
  score_target: 1.0

task_agent:
  model: "Qwen/Qwen3.5-122B-A10B"
  reasoning_effort: "medium"
  base_url: "http://gpu-aic-mv-01-st-p5-node-6:8000/v1"

manager:
  type: "hill_climbing"
  config:
    branch_policy: "best"
    strategy_history_window: 5

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 1800
    memory_mb: 2048
    # A single server saturates fast under many simultaneous tool-loop
    # agents (parallelism 8 on the 35B server produced ~140 connection-error
    # retries and crashed it). Keep concurrency low; raise only if the
    # server is scaled up. The 122B server has more headroom than the 35B,
    # but stay conservative for a reliable baseline.
    parallelism: 3
    max_cases: 10
    scorer: "travel_default"

gatherer:
  type: "default"
  config: {}

editor:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    max_attempts: 2

# Local models (Qwen3.x, gpt-oss) misread echoed `reasoning` items in the
# conversation history as a "wrap up" signal — they exit the tool loop
# without writing the formal <plan> block. Strip them before the next call.
# TRAVEL_CONVERT_MODEL routes the travel scorer's plan->JSON conversion at
# the same Qwen model (base_url comes from task_agent.base_url -> LLM_BASE_URL).
env:
  META_AGENT_STRIP_REASONING: "1"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-122B-A10B"

split:
  seed: 42
  train_size: 60

validators:
  - type: "syntax"
  - type: "signature"
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
