experiment_name: "travel_hgm_dual_10samples_medium"

# Sibling of hgm_dual_travel_10.yaml. Same dual-optimization setup, same
# 10-sample train split, same num_variants=2 / intra_expand_eval_size=10.
# The only delta is the meta-agent model: editor and summarizer both use
# the full `gpt-5.4` model with `reasoning_effort: medium`. Task agent
# stays on `gpt-5.4-mini`.
project: "travel"

loop:
  max_rounds: 60
  score_target: 0.95

task_agent:
  model: "gpt-5.4-mini"
  reasoning_effort: "high"

manager:
  type: "hgm_dual"
  config:
    # HGM knobs.
    eval_budget: 320
    init_expansions: 3
    alpha: 0.5
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 10        # full train per evaluate step
    finalize_top_k: 3          # top-3 topped up on full train before LCB
    full_eval_top_k: 0         # sidecar audit: top-3 finalists each scored on all 120 cases
    seed: 42

    # Dual-optimization knobs.
    num_variants: 2                                   # 2 specialists/expansion (top-2 categories)
    intra_expand_eval_size: 10                        # full 10-case train per intra-expand eval
    variant_parallelism: 2                            # full parallel
    select_metric: "mean"                             # tie-break by lower variance
    categorizer_max_representative_errors: 5
    min_remaining_budget_for_dual: 10
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 1800
    memory_mb: 2048
    parallelism: 10                                   # one worker per train case
    scorer: "travel_default"

gatherer:
  type: "default"
  config: {}

editor:
  type: "default"
  config:
    model: "gpt-5.4"
    reasoning_effort: "medium"
    max_attempts: 2

summarizer:
  type: "default"
  config:
    model: "gpt-5.4"
    reasoning_effort: "medium"

split:
  seed: 42
  train_size: 10

validators:
  - type: "syntax"
  - type: "signature"
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
