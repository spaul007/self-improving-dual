# PROVIDER A/B (2026-09-17): the seed travel agent on deepseek-v4-pro-0813 served by
# StreamLake ONLY (allow_fallbacks false), same 40-case sample (configs/travel_sample40_ids.json),
# reasoning none / temperature 0.2 / max_output_tokens 65536 as in the runs.
# EVAL-ONLY: travel seed (projects/travel/seed, now with the single <plan>
# rescue re-prompt added 2026-09-11) on OpenRouter
# deepseek/deepseek-v4-pro-0813 with REASONING OFF, temperature 0.2.
# Purpose (2026-09-10): measure the seed agent's score RANGE and the $ COST
# of a run on a 40-case stratified random sample of the 120-case benchmark.
#
# WHY REASONING OFF: at reasoning_effort medium this model's reasoning per turn
# grew 498 -> 33k tokens and per-turn latency 14s -> 444s, blowing through a
# 1800s case budget after only 8 turns (run eval_20260910_002328_seed).
# deepseek-v4-flash-0731 at medium showed the same drift and also timed out.
#
# "none" IS THE ONLY SETTING THAT ACTUALLY DISABLES IT. Measured live on
# 2026-09-10 against this slug (reasoning tokens emitted for one fixed prompt):
#     reasoning_effort omitted/null -> 79   (provider default, still reasons!)
#     reasoning_effort "minimal"    -> 96
#     reasoning_effort "low"        -> 23
#     reasoning_effort "none"       ->  0   <-- this config
# llm_wrapper only sends `reasoning: {effort: X}` when the effort string is
# truthy (llm_wrapper.py:428), so leaving it null omits the param and lets the
# provider default back on. Temperature 0.2 still rides along ("none" is
# truthy, and DeepSeek is not in _TEMPERATURE_REJECTING_FAMILIES).
#
# Cost probe first (one 7-day case — the token-heaviest bucket):
#   PYTHONPATH=. python3 evaluate.py \
#       --config configs/eval_travel_or_dsv4pro_0813_noreason.yaml \
#       --agent projects/travel/seed --case-ids 118
#
# Full 40-case sample (ids in configs/travel_sample40_ids.json):
#   PYTHONPATH=. python3 evaluate.py \
#       --config configs/eval_travel_or_dsv4pro_0813_noreason.yaml \
#       --agent projects/travel/seed \
#       --case-ids 3,10,14,16,17,19,23,25,27,33,34,35,37,40,42,43,47,49,56,57,60,64,66,70,72,75,82,91,92,96,98,99,102,104,107,109,110,116,117,118
#
# SAMPLE: stratified random draw, seed 2026 — 6 per trip-length bucket
# (ids 0-19 = 2-day … 100-119 = 7-day) plus 4 extra ids drawn at random from
# the remainder. Per-bucket counts 6/7/7/6/6/8; 22 of the 40 fall in the
# 60-case train split, 18 are held out.
#
# MODEL: deepseek/deepseek-v4-pro-0813 is the DATED pin (OpenRouter list price
# $0.66/M in, $1.98/M out) — distinct from the floating deepseek/deepseek-v4-pro
# used by configs/eval_or_dsv4pro_medium.yaml ($0.87/M in, $1.74/M out).
# Slug verified live through platform_core.llm_wrapper on 2026-09-10: tool_calls
# returned, reasoning medium + temperature 0.2 accepted together, no 400.
#
# SCORING: the plan->JSON conversion stays on the LOCAL vLLM node-5
# Qwen/Qwen3.5-122B-A10B, matching eval_or_dsv4pro_medium.yaml /
# eval_local_qwen122b_medium.yaml / eval_or_glm53flash_medium.yaml, so scores
# are comparable across the model-transfer evals AND every OpenRouter dollar
# the run spends is task-agent cost. If node-5 is down, comment the two
# TRAVEL_CONVERT_* lines below and uncomment the OpenRouter fallback block.
#
# AUTH: platform_core/llm_wrapper.py reads ONE global OPENAI_API_KEY at every
# call site (this checkout has no task_agent.api_key_env). Export the
# OpenRouter key AS OPENAI_API_KEY: the task-agent calls go to OpenRouter with
# it, and the scorer conversion goes to local vLLM, which ignores auth.
#   source /groups/AIC-MV/sudipta.paul/code/random/api.sh
#   export OPENAI_API_KEY="$OpenRouter_API_KEY"
experiment_name: "eval_travel_dsv4pro_provider_streamlake"
project: "travel"

loop:
  max_rounds: 1
  score_target: 1.0

task_agent:
  model: "deepseek/deepseek-v4-pro-0813"
  reasoning_effort: "none"
  temperature: 0.2
  # Per-call output cap (child-env-only -> LLM_MAX_OUTPUT_TOKENS). On the
  # 2026-09-12 full-120 run this model emitted exactly 131,072 output tokens
  # (provider ceiling, stop_reason=incomplete) on 3 cases — a repetition loop
  # while writing the plan, ~800 s and ~$0.26 per call. Real plans top out
  # near 14k; 64k leaves ample room for agents that retry or write more.
  max_output_tokens: 65536
  base_url: "https://openrouter.ai/api/v1"
  # Pinned to an ordered allow-list of upstream providers (StreamLake, then
  # Alibaba); never any provider outside this list. Baidu dropped 2026-09-17.
  extra_body:
    provider:
      order: ["StreamLake"]           # provider A/B (2026-09-17): this provider ONLY
      allow_fallbacks: false

# (manager/editor are required by the config schema but unused by evaluate.py / snapshot_eval.py)
manager:
  type: "hgm"
  config:
    eval_budget: 1000
    init_expansions: 3
    alpha: 0.5
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 16
    finalize_top_k: 3
    snapshot_tree: true
    seed: 42

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 1800
    memory_mb: 2048
    # 40 cases, 40 workers -> the whole sample in flight at once.
    parallelism: 4             # low: one provider's TPM pool, three evals side by side
    scorer: "travel_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"

# editor is unused by evaluate.py; kept for config-schema completeness.
editor:
  type: "agentic"
  config:
    model: "deepseek/deepseek-v4-pro-0813"
    reasoning_effort: "none"
    base_url: "https://openrouter.ai/api/v1"
    max_attempts: 3
    extra_body: {provider: {order: ["StreamLake", "Alibaba"], allow_fallbacks: false}}   # same provider pin as the run configs

env:
  LLM_API_KEY_ENV: "OpenRouter_API_KEY"   # task-agent subprocesses: OpenRouter key, not OPENAI_API_KEY
  META_AGENT_STRIP_REASONING: "1"
  # STALL GUARD. llm_wrapper's DEFAULT_API_TIMEOUT_S is 3600 (llm_wrapper.py:77),
  # sized for slow meta-agent editor calls. When it equals or exceeds
  # wall_time_s_per_case, ONE hung request eats the whole case budget and the
  # 30-attempt retry loop never fires: run eval_20260910_013557_seed lost 2429s
  # of a 3600s budget to a single request that never returned. Keeping this
  # comfortably under wall_time_s_per_case means a stall aborts and RETRIES.
  # Set to 1200 (vs wall_time_s_per_case 1800) per user request 2026-09-10.
  # Note the margin: a stalled call now burns 1200s and leaves only 600s of the
  # case budget for the retry. Fine while calls are fast — the reasoning-off
  # probe finished the hardest case (118) in 347s with 8 calls — but if stalls
  # show up in the results, raise wall_time_s_per_case rather than lowering this.
  LLM_TIMEOUT_S: "1200"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-122B-A10B"
  TRAVEL_CONVERT_BASE_URL: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
  # Fallback if node-5 is down — conversion on OpenRouter instead (adds
  # conversion tokens to the measured OpenRouter bill):
  # TRAVEL_CONVERT_MODEL: "qwen/qwen3.5-122b-a10b"
  # TRAVEL_CONVERT_BASE_URL: "https://openrouter.ai/api/v1"
  # TRAVEL_CONVERT_API_KEY_ENV: "OpenRouter_API_KEY"
  #
  # Case subprocesses run under RLIMIT_AS = memory_mb (2 GB); OpenBLAS
  # per-core thread buffers on this many-core node alone exceed that limit.
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

split:
  train_ids_path: "configs/travel_train_ids.json"

validators:
  - type: "syntax"
  - type: "signature"
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
