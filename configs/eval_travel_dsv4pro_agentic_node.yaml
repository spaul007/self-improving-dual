experiment_name: "eval_travel_dsv4pro_agentic_node"

# STANDALONE FULL-BENCHMARK EVALUATION of one node from the 1000-eval agentic
# runs (all 120 travel cases; no train/eval split). The task_agent / env blocks
# are copied from configs/hgm_travel_1000_dsv4pro_agentic_editmem.yaml so a node
# is scored exactly as it was inside the run (DeepSeek V4 Pro 0813, reasoning
# "none", temperature 0.2, OpenRouter key via LLM_API_KEY_ENV, scorer
# conversion on node-5 Qwen). Only parallelism differs (40, per user).
#   source /groups/AIC-MV/sudipta.paul/code/random/api.sh
#   PYTHONPATH=. python3 evaluate.py --config configs/eval_travel_dsv4pro_agentic_node.yaml \
#       --agent runs/<run>/round_021/task_agent
project: "travel"

eval_visibility: "blackbox"

loop:
  max_rounds: 1
  score_target: 1.0

task_agent:
  model: "deepseek/deepseek-v4-pro-0813"
  reasoning_effort: "none"
  base_url: "https://openrouter.ai/api/v1"
  temperature: 0.2
  # Pinned to one upstream provider (Baidu, fp8): every task-agent call in the
  # run is served by the same weights/quantisation, no silent fallback.
  extra_body:
    provider:
      order: ["Baidu"]
      allow_fallbacks: false

# (manager/editor are required by the config schema but unused by evaluate.py / snapshot_eval.py)
manager:
  type: "hgm"
  config:
    eval_budget: 1000
    init_expansions: 3
    alpha: 0.5
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 16
    finalize_top_k: 3
    snapshot_tree: true
    seed: 42

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 1800
    memory_mb: 2048
    parallelism: 40
    scorer: "travel_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"

editor:
  type: "agentic"
  config:
    model: "deepseek/deepseek-v4-pro-0813"
    reasoning_effort: "low"
    base_url: "https://openrouter.ai/api/v1"
    max_attempts: 3
    extra_body: {provider: {order: ["Baidu"], allow_fallbacks: false}}   # same provider pin as the run configs

env:
  LLM_API_KEY_ENV: "OpenRouter_API_KEY"   # run-wide: task agent + editor
  LLM_TIMEOUT_S: "1200"                   # task-agent per-request cap (< wall_time_s_per_case)
  META_AGENT_STRIP_REASONING: "1"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-122B-A10B"
  TRAVEL_CONVERT_BASE_URL: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
  # Fallback if node-5 is down — conversion on OpenRouter instead (adds
  # conversion tokens to the OpenRouter bill):
  # TRAVEL_CONVERT_MODEL: "qwen/qwen3.5-122b-a10b"
  # TRAVEL_CONVERT_BASE_URL: "https://openrouter.ai/api/v1"

validators:
  - type: "syntax"
  - type: "signature"
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
