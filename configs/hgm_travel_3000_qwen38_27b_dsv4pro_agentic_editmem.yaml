experiment_name: "hgm_travel_3000_qwen38_27b_dsv4pro_agentic_editmem"

# FULL RUN (2026-09-23, edit-memory-sep18-agentic): edit-memory layer with
# edit-centric memory (ranked edits E<node>.<k>, task-agent utilization,
# memory as guidance), agentic editor, eval_budget 3000, arm_min_pulls 4,
# expansion-paired evaluation (expand_eval_size 16), 60-case train split.
#   task agent            : Qwen/Qwen3.8-27B, THINKING OFF, temp 0.2,
#                           max_output_tokens 16384, load-balanced node-3 :8010 (2026-09-24)
#   editor + edit memory  : DeepSeek V4 Pro (dated pin deepseek-v4-pro-0813 on
#                           OpenRouter, OpenRouter_API_KEY via api_key_env,
#                           provider allow-list StreamLake -> Alibaba)
#   scorer conversion     : Qwen3.5-122B on node-5 (TRAVEL_CONVERT_*), as in every
#                           previous run — its own client, unaffected by the
#                           task agent's thinking-off flag
# Derived from hgm_travel_3000_qwen38_27b_qwen122b_agentic_editmem.yaml by
# swapping the meta-agent (editor + curators) to DeepSeek V4 Pro low and the
# task agent to the load-balanced 27B endpoint.
# Everything else — schedule, editor budgets, edit-memory cadence (window 4,
# instruction every 1, bandit over the arms, 30k/8k limits) — unchanged.
# Launch:
#   source /groups/AIC-MV/sudipta.paul/code/random/api.sh
#   PYTHONPATH=. python3 main_loop.py --config configs/hgm_travel_3000_qwen38_27b_dsv4pro_agentic_editmem.yaml
project: "travel"

eval_visibility: "blackbox"   # ignored by the agentic editor: scorer never exposed
verbose: true                 # META_AGENT_VERBOSE=1: full prompts + message history per session

loop:
  max_rounds: 1000
  score_target: 0.99

task_agent:
  model: "Qwen/Qwen3.8-27B"
  # Thinking OFF. reasoning_effort does NOT control it on this server: a
  # request with no `reasoning` field still returned reasoning_tokens=61
  # (probe 2026-09-23). The chat template flag below is the only switch —
  # same probe with it: reasoning_tokens=0, output items ['message'] only.
  # It reaches every case subprocess as LLM_EXTRA_BODY (meta_agent/evaluator.py)
  # and is merged verbatim into the request body (platform_core/llm_wrapper.py).
  # reasoning_effort stays unset: with thinking off it does nothing, and
  # setting it would re-add a `reasoning` field.
  temperature: 0.2
  max_output_tokens: 16384          # guard against a degenerate loop
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
  # Load-balanced 27B endpoint (node-3 :8010 fronts two servers). Verified
  # 2026-09-24: /v1/models 200, Responses API + tools OK through the proxy,
  # enable_thinking=false honoured (reasoning_tokens 0), 24 concurrent calls
  # served with 2 s median latency.
  base_url: "http://gpu-aic-mv-02-st-p5-node-3:8010/v1"

manager:
  type: "hgm"
  config:
    eval_budget: 3000
    init_expansions: 3
    alpha: 0.5
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 16
    # Expansion-paired evaluation (agentic setups, per user request
    # 2026-09-13): every freshly expanded child is evaluated on 16 random
    # train cases immediately (charged to the budget and to the widening
    # counter), so no editor session goes unmeasured. 0 restores the reference's decoupled behaviour. At
    # 3000 evals this is ~55 nodes (the schedule widens like sqrt(evals))
    # / ~187 batches, ~55 of them mandatory child evaluations.
    expand_eval_size: 16
    max_consecutive_edit_failures: 5   # abort when the editor is dead (2026-09-16: 495 failed rounds on an exhausted key)
    finalize_top_k: 3        # top-3 finalists topped up to the full 60-case train split before the final pick
    # Fresh 60-case seed pre-eval on the Qwen task agent (no seed_round_dir).
    full_eval_top_k: 0
    snapshot_tree: true
    seed: 42

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 1800
    memory_mb: 2048
    parallelism: 16
    scorer: "travel_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"

# Agentic editor on DeepSeek V4 Pro. reasoning "low" (medium drifts in long
# tool loops); llm_timeout_s
# caps one request so a stall cannot eat the
# session. The prompt is paths + budget only (include_manager_context false):
# the agent reads the parent's evidence from disk itself.
editor:
  type: "agentic"
  config:
    model: "deepseek/deepseek-v4-pro-0813"
    reasoning_effort: "low"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OpenRouter_API_KEY"
    # Pinned to an ordered allow-list of upstream providers (2026-09-17, after
    # Baidu rate-limited a run; dropped entirely for the optimization runs after
    # the 2026-09-17 provider A/B): StreamLake, then Alibaba; never any provider
    # outside this list.
    extra_body:
      provider:
        order: ["StreamLake", "Alibaba"]
        allow_fallbacks: false
    llm_timeout_s: 600
    max_attempts: 3
    max_llm_calls: 150
    timeout_s: 5400
    bash_timeout_s: 120
    max_tool_output_chars: 20000
    max_view_chars: 40000
    sandbox: "auto"
    include_manager_context: false
    # How much of the run the meta-agent may read (bash + editor tool):
    #   "run"    — every node of the run (the setting of the finished runs)
    #   "parent" — only $PARENT_DIR and its own $NODE_DIR; no $RUN_DIR root
    read_scope: "run"

env:
  # No run-wide LLM_API_KEY_ENV: the task agent is on the local node-5 vLLM;
  # the editor and the edit-memory layer name api_key_env themselves.
  LLM_TIMEOUT_S: "1200"                   # task-agent per-request cap (< wall_time_s_per_case)
  META_AGENT_STRIP_REASONING: "1"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.5-122B-A10B"
  TRAVEL_CONVERT_BASE_URL: "http://gpu-aic-mv-02-st-p5-node-5:8000/v1"
  # Fallback if node-5 is down — conversion on OpenRouter instead (adds
  # conversion tokens to the OpenRouter bill):
  # TRAVEL_CONVERT_MODEL: "qwen/qwen3.5-122b-a10b"
  # TRAVEL_CONVERT_BASE_URL: "https://openrouter.ai/api/v1"

split:
  train_ids_path: "configs/travel_train_ids.json"   # the 60 predetermined cases

validators:
  - type: "syntax"
  - type: "signature"
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"

# EDIT MEMORY (2026-09-16): every window_size successful expansions an agentic
# curator reviews the newest nodes (diffs, editor transcripts, per-case
# outcomes) and writes edit_memory/window_NNN/curation.md; one call then
# writes edit_memory/edit_memory_vNNN.md (ranked edits — one entry per mechanism,
# which may recur across nodes — usefulness, strategy vs implementation, guidance;
# never a score prediction). A Thompson bandit over
# the two arms' pooled HGM tallies decides per expansion whether the editor
# sees the memory ($EDIT_MEMORY_FILE; that arm always gets the whole run
# readable so it can open the nodes the memory cites). Every
# instruction_every memory versions an instruction curator audits the
# with-memory nodes and one call revises the generator's addendum.
# Requires manager.config.expand_eval_size > 0.
edit_memory:
  type: "agentic"
  config:
    window_size: 4
    instruction_every: 1          # audit + revise the addendum after every memory version (2026-09-17)
    selection: "bandit"           # bandit | always | never (never = shadow: memory written, nobody reads it)
    arm_min_pulls: 4
    beta_prior: 1.0
    seed: 42
    model: "deepseek/deepseek-v4-pro-0813"
    reasoning_effort: "low"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OpenRouter_API_KEY"
    # Pinned to an ordered allow-list of upstream providers (2026-09-17, after
    # Baidu rate-limited a run; dropped entirely for the optimization runs after
    # the 2026-09-17 provider A/B): StreamLake, then Alibaba; never any provider
    # outside this list.
    extra_body:
      provider:
        order: ["StreamLake", "Alibaba"]
        allow_fallbacks: false
    llm_timeout_s: 600
    curator:
      max_llm_calls: 60
      timeout_s: 2400
      bash_timeout_s: 120
      max_tool_output_chars: 20000
      max_view_chars: 40000
      sandbox: "auto"
      max_attempts: 2
    memory_max_chars: 30000
    instruction_addendum_max_chars: 8000
