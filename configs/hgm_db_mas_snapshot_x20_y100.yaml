# An HGM run against db_mas_snapshot sized by target tree shape: "I want
# roughly X good-enough agents, each evaluated on roughly Y examples on
# average" -- X=20, Y=100 here.
#
#   PYTHONPATH=. python3 main_loop.py --config configs/hgm_db_mas_snapshot_x20_y100.yaml
#
# --- How eval_budget and alpha were derived ---
#
# B = X*Y = 20*100 = 2000.
# alpha solved from B**alpha == X (matches hgm_tree.py::schedule_favors_expand
# exactly): alpha = ln(X)/ln(B) = ln(20)/ln(2000) = 0.3941
#
# t_case=36.257s/case is REAL measured throughput at parallelism=1 -- the
# live HGM sanity run's own seed pre-eval (6 real cases,
# project_metrics.avg_elapsed_s), consistent with the earlier single direct
# workflow.py call (37.45s).
#
#   python3 size_eval_budget.py --t-case 36.257 --target-agents 20 \
#     --evals-per-agent 100 --eval-batch-size 20 --fixed-unbudgeted-evals 300 \
#     --max-rounds 40 --t-editor 60 --t-summarizer-pair 15
#   -> eval_budget=2000, alpha=0.3941, projected ~24.3h total at
#   parallelism=1 (the only value actually validated so far -- each case
#   internally fans out ~11 concurrent LLM calls, so parallelism=2 would
#   roughly halve wall-clock time at the cost of ~22 simultaneous host-side
#   calls, untested at this concurrency; deliberately NOT chosen for this
#   run).
#
# --- Only 100 total cases exist in this project ---
#
# train_size = Y = 100 = the ENTIRE dataset -- confirmed with the user this
# forces eval_size=0 (no held-out validation at all, unlike every other
# X/Y config this session). This in turn makes full_eval_top_k's sidecar
# audit pointless (its target set, train_case_ids + eval_case_ids, would be
# identical to what's already covered by training-time evals, so it would
# have ~nothing new to evaluate) -- set to 0 rather than the usual 3.
# finalize_top_k kept at 3 purely as a display aid among train-based
# candidates (still cheap: bounded to the same 100-case train pool, not
# charged to eval_budget).

experiment_name: "db_mas_snapshot_hgm_x20_y100"

project: "db_mas_snapshot"
seed_dir_name: "db_mas"

# Same exclude-list as configs/hgm_db_mas_snapshot_sanity.yaml -- see that
# file's comments for the full rationale on each entry.
mutable_exclude:
  - "tools/immutable/"
  - "eval/"
  - "data/"
  - "snapshot/"
  - "config.py"
  - "workflow.py"
  - "benchmark/"

tool_source_dirs:
  - "tools"
  - "agents"

loop:
  # ~2x the X=20 target node count.
  max_rounds: 40
  score_target: 1.0

manager:
  type: "hgm"
  config:
    eval_budget: 2000
    init_expansions: 1
    # Derived, not the framework default (0.6) -- see the sizing note above.
    alpha: 0.3941
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    # 1/5 of train_size (100) -- each EVALUATE step here is expensive
    # (~11 concurrent LLM calls per case even at evaluator parallelism=1),
    # so a smaller batch keeps the schedule able to reassess frequently
    # without letting summarizer overhead dominate (eval_budget/
    # eval_batch_size = 100 EVALUATE steps total).
    eval_batch_size: 20
    finalize_top_k: 3
    full_eval_top_k: 0   # disabled -- see the sizing note above on why
    seed: 42

evaluator:
  type: "subprocess"
  config:
    # Same as the sanity config -- no Docker/container startup at inference
    # time (this project's biggest structural difference from the
    # already-integrated projects/db_mas/), but a single case still fans
    # out ~11 concurrent LLM calls (5 investigators + 5 compress + 1 lead).
    wall_time_s_per_case: 600
    memory_mb: 1024
    # Kept at 1, the only value actually validated (the live sanity run) --
    # see the sizing note above on the parallelism=2 trade-off, not chosen
    # for this run. wikihop_mas_2k's own HGM run is also concurrently using
    # the same shared vLLM hosts right now.
    parallelism: 1
    scorer: "db_mas_snapshot_default"

gatherer:
  type: "db_mas_snapshot_default"
  config:
    n_hard_cases: 2

editor:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-2:8000/v1"
    max_attempts: 2

summarizer:
  type: "db_mas_snapshot_default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-2:8000/v1"

failure_summarizer:
  type: "default"
  config:
    model: "Qwen/Qwen3.5-122B-A10B"
    reasoning_effort: "medium"
    base_url: "http://gpu-aic-mv-02-st-p5-node-2:8000/v1"

# This project's own llm_client.py reads these directly. Re-check this
# endpoint is still live before launching -- it rotates.
env:
  MAS_MODEL: "Qwen/Qwen3.5-35B-A3B"
  MAS_BASE_URL: "http://gpu-aic-mv-02-st-p5-node-1:8000/v1"
  MAS_API_KEY: "dummy"

# The ENTIRE 100-case dataset goes to train; no held-out eval (see the
# sizing note above -- confirmed with the user this is acceptable for now).
split:
  seed: 42
  train_size: 100
  eval_size: 0

validators:
  - type: "syntax"
  - type: "signature"
  - type: "immutable_files"
  - type: "load_test"
