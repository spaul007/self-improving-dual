# Variant of hgm_travel_deepseek27b_fromseed_agentic_X100Y300_newtools.yaml
# -- same gated (original) composite score, same new tools
# (evaluate_variant_max_calls=2, tools_dir_alias_enabled=true), but:
#   (a) "collaboration_workflow" removed from active_blocks -- the
#       adaptive block bandit can no longer select it at all.
#   (b) task_agent + the plan-to-JSON converter moved from
#       gpu-aic-mv-02-st-p5-node-6:8001 to gpu-aic-mv-02-st-p5-node-5:8001
#       (confirmed live, serving the same Qwen/Qwen3.8-27B) -- spreads
#       GPU load off node-6, which already has three concurrent HGM runs
#       on it.
#
#   PYTHONPATH=. python3 main_loop.py --config configs/hgm_travel_deepseek27b_fromseed_agentic_X100Y300_newtools_nocollab_node5.yaml

experiment_name: "travel_mas_refactored_deepseek27b_fromseed_agentic_X100Y300_newtools_nocollab_node5"
project: "travel_mas_refactored"
seed_dir_name: "seed_qwen27b_nothink"
verbose: true

mutable_exclude:
  - "workflow.py"
  - "benchmark/"
  - "agents/immutable/"

loop:
  max_rounds: 130
  score_target: 1.0

task_agent:
  model: "Qwen/Qwen3.8-27B"
  temperature: 0.2
  max_output_tokens: 16384
  base_url: "http://gpu-aic-mv-02-st-p5-node-5:8001/v1"

manager:
  type: "hgm_block_tagged"
  config:
    eval_budget: 30000
    init_expansions: 2
    alpha: 0.446716
    epsilon: 0.25
    beta_prior: 1.0
    clade_pseudo_count: 10000
    eval_batch_size: 60
    eval_repeats: 2
    finalize_top_k: 5
    full_eval_top_k: 0
    seed: 42
    block_selection_strategy: "adaptive"
    active_blocks:
      - "foundation_capability"
      - "individual_subagent"
      - "mixed"
      - "verifiers"
    implementation_strategy_selection_strategy: "adaptive"

evaluator:
  type: "subprocess"
  config:
    wall_time_s_per_case: 3600
    memory_mb: 2048
    parallelism: 32
    scorer: "travel_mas_refactored_default"

gatherer:
  type: "default"
  config:
    error_categorizer: "projects.travel.travel_error_categorizer:categorize_errors"
    n_hard_cases: 1

editor:
  type: "default"
  config:
    model: "deepseek/deepseek-v4-pro"
    base_url: "https://openrouter.ai/api/v1"
    reasoning_effort: "medium"
    max_output_tokens: 65536
    max_attempts: 2
    agentic_editing: true
    agentic_max_turns: 100
    evaluate_variant_max_calls: 2
    tools_dir_alias_enabled: true
    agentic_tools:
      - "read_file"
      - "write_file"
      - "str_replace_file"
      - "grep"
      - "run_code_validators"
      - "run_python"
      - "list_cases"
      - "show_case"
      - "submit_self_improvement_summary"
      - "evaluate_variant"

failure_summarizer:
  type: "default"
  config:
    model: "deepseek/deepseek-v4-pro"
    base_url: "https://openrouter.ai/api/v1"
    reasoning_effort: "medium"

block_suggester:
  type: "default"
  config:
    model: "deepseek/deepseek-v4-pro"
    base_url: "https://openrouter.ai/api/v1"
    reasoning_effort: "medium"
    strategies_path: "strategies.md"
    agentic_access: true
    agentic_max_turns: 100
    agentic_tools:
      - "read_file"
      - "grep"
      - "list_cases"
      - "show_case"
      - "run_python"

env:
  META_AGENT_STRIP_REASONING: "1"
  TRAVEL_CONVERT_MODEL: "Qwen/Qwen3.8-27B"
  TRAVEL_CONVERT_BASE_URL: "http://gpu-aic-mv-02-st-p5-node-5:8001/v1"
  TRAVEL_CONVERT_ENABLE_THINKING: "false"

split:
  seed: 42
  train_size: 60
  eval_size: 60
  stratify_by: "meta_info.days"

validators:
  - type: "syntax"
  - type: "signature"
    config:
      workflow_filenames: ["workflow.py", "mas_workflow.py"]
  - type: "imports"
  - type: "schema_wrapper_consistency"
  - type: "mutable_tool_imports"
  - type: "mutable_tool_routing"
  - type: "immutable_files"
  - type: "load_test"
  - type: "undefined_names"
  - type: "smoke_test"
